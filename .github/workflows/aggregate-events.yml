name: Aggregate public events

# Runs in the PUBLIC mapsee-aggregator repo: GitHub gives public repos
# unlimited free Actions minutes. Triggers are schedule + workflow_dispatch
# ONLY - never add pull_request triggers, which would expose the repo secrets
# (including SUPABASE_SERVICE_ROLE_KEY) to untrusted fork code.

# THREE jobs, once daily — tuned to minimize GitHub Actions minutes without
# dropping any source:
#
#   • ticketmaster — the ONE Ticketmaster sweep (US metros THEN international).
#     TM's key is rate-limited to ~2 req/s, so this is serial by nature; running
#     US + global in a single job avoids two runners fighting the same key
#     (429-backoff waste) and pays the runner/pip overhead once.
#   • feeds — ICS + open-data + venue/GraphQL calendars. These carry no coords,
#     so each venue is geocoded via Photon (~1.1s); isolated with its own cache
#     so a slow feed can't drag the TM sweep and the cache actually persists.
#   • meetup — ONE Meetup sweep (US then international). Meetup shares no key
#     with Ticketmaster, so it runs parallel; it used to run in TWO places
#     (here for the US, a separate job for international), which was both
#     confusing and what pushed extra_sources past its timeout.
#   • extra_sources — SeatGeek/DICE/AXS metro sweep (skipped whole when
#     none of those keys are set) + Eventbrite + NPS/Localist/Sports.
#
# Minutes are billed per job-minute, so fewer jobs + one daily run + no key
# contention is the win. Cadence: bump the cron back toward */12 if you want it
# fresher after topping up minutes. To add a metro edit METROS; to add a feed
# edit the *_sources.json (no workflow change).
#
# Required repo secrets:
#   TICKETMASTER_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, MAPSEE_HOST_PROFILE_ID

on:
  schedule:
    - cron: "17 6 * * *"           # DAILY: Ticketmaster + feeds
    #                                WEDNESDAY's daily run is a FULL REFRESH —
    #                                every sync step drops --only-new on day 3,
    #                                so changes at the source (cancellations,
    #                                new times, moved venues) reach the map once
    #                                a week instead of never. See any sync step.
    - cron: "40 6 * * 1,4"         # Mon & Thu: the heavy SeatGeek/Meetup/Eventbrite sweep (2x/week is plenty)
  workflow_dispatch:                 # manual "Run workflow"
    inputs:
      full_refresh:
        description: "Re-sync ALL events (update existing) — already automatic on Wednesdays"
        type: boolean
        default: false
      extra_only:
        description: "Run ONLY the SeatGeek+Meetup+Eventbrite job (skip Ticketmaster & feeds)"
        type: boolean
        default: false

concurrency:
  group: aggregate-events
  cancel-in-progress: false

env:
  TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  MAPSEE_HOST_PROFILE_ID: ${{ secrets.MAPSEE_HOST_PROFILE_ID }}
  # Extra free sources — add these as repo secrets to light them up (each adapter
  # skips silently if its key is unset, so the pipeline runs fine without them):
  SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}       # seatgeek.com/build
  # Partner-gated ticketing APIs — each adapter no-ops until its key is set.
  DICE_API_KEY: ${{ secrets.DICE_API_KEY }}
  AXS_API_KEY: ${{ secrets.AXS_API_KEY }}
  AXS_API_BASE: ${{ secrets.AXS_API_BASE }}
  # Meetup (needs a Meetup Pro OAuth consumer): jobs mint a fresh 1-hour token
  # from these JWT secrets — MEETUP_CLIENT_KEY, MEETUP_MEMBER_ID,
  # MEETUP_SIGNING_KEY_ID, MEETUP_PRIVATE_KEY. Not set here so the minted
  # MEETUP_OAUTH_TOKEN (via GITHUB_ENV) isn't overridden.
  NPS_API_KEY: ${{ secrets.NPS_API_KEY }}                     # nps.gov/subjects/developer
  THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}             # optional; "3" test key used if unset
  RECREATION_GOV_KEY: ${{ secrets.RECREATION_GOV_KEY }}       # ridb.recreation.gov/docs (free)
  USDA_LOCALFOOD_API_KEY: ${{ secrets.USDA_LOCALFOOD_API_KEY }}  # usdalocalfoodportal.com/fe/datasharing
  # Optional: exact Spotify artist "listen" links on music events.
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}         # developer.spotify.com/dashboard
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

jobs:
  ticketmaster:
    name: Ticketmaster (US metros + international)
    runs-on: ubuntu-latest
    # runs on the DAILY cron + manual (unless extra_only); skipped on the Mon/Thu extra-sources cron
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    timeout-minutes: 300             # US + international TM are SERIAL on the shared ~2 req/s key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Ingest US metros from metros_us.txt (Ticketmaster, serial — shared key is ~2 req/s)
        run: |
          set +e                       # one metro failing must not abort the sweep
          METROS=()
          while IFS= read -r _L; do METROS+=("$_L"); done < <(sed -E 's/#.*//; s/[[:space:]]//g' metros_us.txt | grep -E '^-?[0-9.]+,-?[0-9.]+$')
          echo "US metros loaded: ${#METROS[@]}"
          for LL in "${METROS[@]}"; do
            echo "== metro $LL =="
            R=25; case "$LL" in "38.9072,-77.0369"|"47.6062,-122.3321") R=100;; esac   # DC + Seattle — wide metros
            python mapsee_ingest.py --latlong "$LL" --radius "$R" --within-days 90 --store mapsee_events.json
          done
          python - <<'PY'
          import json
          print("unique events in store:", len(json.load(open("mapsee_events.json"))["events"]))
          PY
      - name: Sync US metros to Supabase (batch-geocoded via US Census)
        run: |
          ONLY_NEW="--only-new"
          # WEDNESDAY IS REFRESH DAY. --only-new skips every event already in the
          # table, so a scheduled run can only ever ADD: a cancellation, a
          # postponement or a venue change at the source never reached the map,
          # and full_refresh was a workflow_dispatch input nobody remembers to
          # tick. Wednesday has no heavy sweep (that is Mon & Thu), so the daily
          # job has the refresh to itself.
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          echo "sync mode: ${ONLY_NEW:-FULL REFRESH (updates all events)}"
          python mapsee_supabase_sync.py --store mapsee_events.json --skip-unchanged $ONLY_NEW
      - name: Sweep Ticketmaster across the international metros (ex-US)
        run: |
          set +e
          [ -f metros_global.json ] || { echo "no metros_global.json — skipping international"; exit 0; }
          # Ticketmaster ONLY: its key is ~2 req/s so this stays serial in one
          # job. Meetup shares no key, so it sweeps in parallel (meetup_global) -
          # that is what lets metros_global.json keep growing.
          python mapsee_sweep_global.py --config metros_global.json --store global_events.json --within-days 90 --sources ticketmaster
          python - <<'PY'
          import json
          try: print("global events in store:", len(json.load(open("global_events.json"))["events"]))
          except Exception as e: print("no global store:", e)
          PY
      - name: Sync international events to Supabase (events carry coords — no geocoding)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          if [ -f global_events.json ]; then
            python mapsee_supabase_sync.py --store global_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no international events ingested — nothing to sync"
          fi

  meetup:
    name: Meetup sweep (US + international metros, parallel)
    runs-on: ubuntu-latest
    # Separate job on purpose: Meetup does not share Ticketmaster's rate-limited
    # key, so sweeping it in parallel roughly halves international wall clock and
    # lets metros_global.json keep growing.
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Mint fresh Meetup token (optional; the sweep works unauthenticated)
        env:
          MEETUP_CLIENT_KEY: ${{ secrets.MEETUP_CLIENT_KEY }}
          MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
        run: |
          TOK="$(python meetup_token.py)"
          if [ -n "$TOK" ]; then echo "::add-mask::$TOK"; echo "MEETUP_OAUTH_TOKEN=$TOK" >> "$GITHUB_ENV"; echo "meetup: token minted OK"; else echo "meetup: NO token (running unauthenticated)"; fi
      - name: Sweep Meetup across the US metros
        run: |
          set +e
          METROS=()
          while IFS= read -r _L; do METROS+=("$_L"); done < <(sed -E 's/#.*//; s/[[:space:]]//g' metros_us.txt | grep -E '^-?[0-9.]+,-?[0-9.]+$')
          echo "US metros loaded: ${#METROS[@]}"
          for LL in "${METROS[@]}"; do
            R=25; case "$LL" in "38.9072,-77.0369"|"47.6062,-122.3321") R=100;; esac
            python mapsee_ingest_meetup.py --latlong "$LL" --radius "$R" --store meetup_events.json
          done
          exit 0
      - name: Sync the US leg NOW (a later timeout must not discard it)
        run: |
          # Hard lesson: extra_sources was cancelled at its timeout mid-loop and
          # threw away ~42k already-ingested events because the only sync ran at
          # the very end. Checkpoint between legs so the worst a timeout can cost
          # is the leg still in flight.
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          if [ -f meetup_events.json ]; then
            python mapsee_supabase_sync.py --store meetup_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no US Meetup events yet - nothing to sync"
          fi
      - name: Sweep Meetup across the international metros
        run: |
          set +e
          [ -f metros_global.json ] || { echo "no metros_global.json — skipping"; exit 0; }
          python mapsee_sweep_global.py --config metros_global.json --store meetup_events.json --within-days 90 --sources meetup
          exit 0
      - name: Sync Meetup events to Supabase (events carry coords — no geocoding)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          if [ -f meetup_events.json ]; then
            python mapsee_supabase_sync.py --store meetup_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no Meetup events ingested — nothing to sync"
          fi

  feeds:
    name: ICS + open-data + venue feeds
    runs-on: ubuntu-latest
    # runs on the DAILY cron + manual (unless extra_only); skipped on the Mon/Thu extra-sources cron
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    # 120 was the budget when this job took 54-58 minutes. It hit exactly 120 on
    # 2026-08-10 and lost the run. The catalog has grown under it — daily
    # curation instead of weekly, +67 Mobilizon instances, and Squarespace, Luma,
    # Tribe and CKAN all added since — and every new source brings new venues to
    # geocode at ~1.1s each. Raised to match, with the checkpoint sync below as
    # the thing that makes a future overrun survivable rather than total.
    timeout-minutes: 240
    # Cap NEW Photon geocodes per run (~1.1s each) so this job ALWAYS finishes and
    # actions/cache uploads the freshly-warmed geocode cache - a timed-out job
    # never saves it, so the same backlog re-runs forever. 5000 ~= 92 min of
    # geocoding, which fits the 2h window and drains a cold-cache backlog in far
    # fewer runs while still finishing (so the cache persists). Once warm, most
    # runs are cache hits and finish fast. Lower this (or 0 to uncap) after it's
    # caught up, to cut GitHub Actions minutes.
    env:
      GEOCODE_MAX_NEW: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # geocode_cache.json is COMMITTED and is the source of truth for `|market`
      # keys, whose coordinates decide market fingerprints. The warm cache is
      # restored to a SIDE path so actions/cache can never overwrite it — it is a
      # speed optimization for the other adapters (which fingerprint on venue
      # TEXT, so a coordinate that drifts there only nudges a pin), not identity.
      - name: Restore warm geocode cache (Photon is ~1.1s/venue — persist across runs)
        uses: actions/cache@v4
        with:
          path: |
            geocode_cache.warm.json
            ics_feed_cache.json
          key: geocode-cache-feeds-${{ github.run_id }}
          restore-keys: geocode-cache-
      - name: Merge the warm geocode cache UNDER the committed one
        run: |
          python - <<'PY'
          import json
          def load(p):
              try:
                  with open(p, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}
          warm, tracked = load("geocode_cache.warm.json"), load("geocode_cache.json")
          merged = {**warm, **tracked}          # committed entries always win
          with open("geocode_cache.json", "w", encoding="utf-8") as fh:
              json.dump(merged, fh, ensure_ascii=False, indent=1, sort_keys=True)
              fh.write("\n")
          print(f"warm={len(warm)} committed={len(tracked)} merged={len(merged)}")
          PY
      - name: Import city open-data events (Socrata)
        run: |
          if [ -f opendata_sources.json ]; then
            python mapsee_ingest_opendata.py --config opendata_sources.json --store feeds_events.json
          else
            echo "no opendata_sources.json — skipping city open-data"
          fi
      - name: Import ICS calendar feeds
        run: |
          if [ -f ics_sources.json ]; then
            python mapsee_ingest_ics.py --config ics_sources.json --store feeds_events.json
          else
            echo "no ics_sources.json — skipping ICS feeds"
          fi
      # --skip-type overpass is LOAD-BEARING, not tidiness. The OSM sweep is 245
      # Overpass calls and takes over three hours; everything else in this file
      # finishes in about a minute. On Monday 2026-08-17 it ran here and the job
      # hit its 240-minute ceiling INSIDE this step — so the checkpoint below
      # never ran and the whole day was lost, including the Socrata and ICS work
      # that had already succeeded and the twenty sources queued behind it. The
      # Saturday and Sunday either side took 52 and 55 minutes, because
      # run_weekdays keeps the sweep to Mondays. It now has its own job.
      - name: Import recurring community markets (farmers markets, expanded to dated occurrences)
        run: |
          if [ -f market_sources.json ]; then
            python mapsee_ingest_markets.py --config market_sources.json \
                                            --skip-type overpass \
                                            --store feeds_events.json
          else
            echo "no market_sources.json — skipping markets"
          fi

      # CHECKPOINT. Everything above is the bulk of this job's supply — Socrata
      # open data, 258 ICS feeds and 481 markets — and until this step existed it
      # was all held in feeds_events.json until the single sync at the very end.
      #
      # On 2026-08-10 this job hit its timeout at exactly 120 minutes, ON THE
      # MARKETS STEP. Every step after it was skipped, INCLUDING the sync, so two
      # hours of open data and ICS were ingested and thrown away: plansie,
      # awaresie and fleabop got nothing at all that day. The four runs before it
      # took 54-58 minutes, so this was not a slow drift anyone could have
      # watched — it doubled between two consecutive days.
      #
      # The timeout below is raised to match the catalog, but that only moves the
      # cliff. This is the part that removes it: a run cut off after this point
      # loses its tail instead of losing everything. Exactly the reasoning the
      # meetup job already uses for its US leg — "a later timeout must not
      # discard it" — applied to the job that actually needed it.
      #
      # Safe to run twice: the sync upserts on (external_source, external_id), so
      # the final sync re-offering these rows is a no-op, and --only-new skips
      # them before they are even built.
      - name: Checkpoint — sync what has landed so far (a later timeout must not discard it)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json --skip-unchanged $ONLY_NEW || true
          else
            echo "nothing ingested yet — nothing to checkpoint"
          fi
      # ~2,900 free weekly runs in 21 countries — the whole 'running' layer, which
      # had no curated feed in ANY country. One fetch; the config pins it to one
      # weekday because a weekly schedule re-expands to identical rows.
      - name: Import parkrun (weekly 5k + junior 2k, expanded to dated occurrences)
        run: |
          if [ -f parkrun_sources.json ]; then
            python mapsee_ingest_parkrun.py --config parkrun_sources.json --store feeds_events.json
          else
            echo "no parkrun_sources.json — skipping parkrun"
          fi
      - name: Import curated recurring community programs (e.g. free summer meals, expanded to dated occurrences)
        run: |
          if [ -f program_sources.json ]; then
            python mapsee_ingest_programs.py --config program_sources.json --store feeds_events.json
          else
            echo "no program_sources.json — skipping programs"
          fi
      - name: Import venue / local-ticketing sites (schema.org Event JSON-LD)
        run: |
          if [ -f jsonld_sources.json ]; then
            python mapsee_ingest_jsonld.py --config jsonld_sources.json --store feeds_events.json
          else
            echo "no jsonld_sources.json — skipping"
          fi
      # Squarespace is where park conservancies, galleries and small arts
      # nonprofits actually live. This reads the BARE collection page - the
      # stock robots.txt disallows ?format=json on every site on the platform -
      # and see the adapter docstring for the default-pin trap it defends
      # against, which would otherwise file Seattle events in Manhattan.
      - name: Import Squarespace Events collections (bare collection page)
        run: |
          if [ -f squarespace_sources.json ]; then
            python mapsee_ingest_squarespace.py --config squarespace_sources.json --store feeds_events.json
          else
            echo "no squarespace_sources.json — skipping"
          fi
      # MyListing is the WordPress directory theme behind chambers of commerce,
      # tourism boards and "what's on in <town>" sites - the layer that carries a
      # whole small town's calendar and reaches no ticketing platform at all.
      # One request per page of results, from the endpoint the page itself names.
      # This adapter is SLOWER than its neighbours by design: it fetches each
      # distinct listing once for the description, because the results carry none
      # and derive_categories has nothing to read without it.
      - name: Import MyListing directory events (chambers, tourism boards)
        run: |
          if [ -f mylisting_sources.json ]; then
            python mapsee_ingest_mylisting.py --config mylisting_sources.json --store feeds_events.json
          else
            echo "no mylisting_sources.json — skipping"
          fi
      # Luma carries the tech/AI/startup/creative-meetup layer of a city, almost
      # none of which reaches Eventbrite or Meetup, and every listing ships real
      # coordinates so nothing here needs the geocoder.
      - name: Import Luma calendars and city Discover feeds
        run: |
          if [ -f luma_sources.json ]; then
            python mapsee_ingest_luma.py --config luma_sources.json --store feeds_events.json
          else
            echo "no luma_sources.json — skipping"
          fi
      - name: Import restaurants (pickup windows from open hours + menu preview)
        run: |
          if [ -f restaurant_sources.json ]; then
            python mapsee_ingest_restaurants.py --config restaurant_sources.json --store feeds_events.json
          else
            echo "no restaurant_sources.json — skipping"
          fi
      - name: Import Seoul cultural events (data.seoul.go.kr, gated on secret)
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: |
          python mapsee_ingest_seoul.py --store feeds_events.json
          exit 0
      - name: Import affiliate takeout catalogs (DoorDash / Uber Eats, gated on secrets)
        env:
          DOORDASH_FEED_URL: ${{ secrets.DOORDASH_FEED_URL }}
          UBEREATS_FEED_URL: ${{ secrets.UBEREATS_FEED_URL }}
        run: |
          python mapsee_ingest_affiliates.py --config affiliate_sources.json --store feeds_events.json
          exit 0
      - name: Import authorized Uber Eats stores (Marketplace API, gated on secrets)
        env:
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          # set these to the sandbox endpoints while testing a TEST app; DELETE
          # both secrets when you move to a Prod app (defaults hit production)
          UBER_AUTH_URL: ${{ secrets.UBER_AUTH_URL }}
          UBER_API_BASE: ${{ secrets.UBER_API_BASE }}
        run: |
          python mapsee_ingest_ubereats.py --store feeds_events.json
          exit 0
      - name: Import VenuePilot venues (public GraphQL — Baba Yaga, etc.)
        run: |
          if [ -f venuepilot_sources.json ]; then
            python mapsee_ingest_venuepilot.py --config venuepilot_sources.json --store feeds_events.json
          else
            echo "no venuepilot_sources.json — skipping"
          fi
      # Venues whose own site publishes nothing readable because the page is a
      # DICE widget. Reads the venue's PUBLIC DICE PAGE — never api.dice.fm,
      # which is the one path dice.fm/robots.txt disallows. Costs one request per
      # venue and NO geocoding: the payload carries the venue's exact
      # coordinates, which is why this can sit in a job whose time budget is
      # spent on Photon.
      - name: Import DICE venue pages (venues whose own site is just the widget)
        run: |
          if [ -f dice_venue_sources.json ]; then
            python mapsee_ingest_dice_venue.py --config dice_venue_sources.json --store feeds_events.json
          else
            echo "no dice_venue_sources.json — skipping"
          fi
      - name: Import The Rolodex (independent improv/sketch shows, public JSON)
        run: |
          if [ -f rolodex_sources.json ]; then
            python mapsee_ingest_rolodex.py --config rolodex_sources.json --store feeds_events.json
          else
            echo "no rolodex_sources.json — skipping"
          fi
      # One of the two scrapers in this sweep. pioneersquare.org publishes no
      # feed at all — no iCal, no Tribe REST, no event post type, no schema.org
      # Event — so this reads the markup, which is a maintenance cost every
      # other step here avoids. It earns it: a dense arts neighbourhood whose
      # galleries and artist talks appear in no ticketing API. If the theme
      # changes it finds nothing and says so, and source-health.yml turns that
      # into an issue.
      - name: Import Visit Pioneer Square (Seattle neighbourhood calendar, HTML)
        run: |
          if [ -f pioneersquare_sources.json ]; then
            python mapsee_ingest_pioneersquare.py --config pioneersquare_sources.json --store feeds_events.json
          else
            echo "no pioneersquare_sources.json — skipping"
          fi
      # The other scraper, and the same bargain: seattlecenter.com has no feed
      # either (robots.txt is a 404, there is no JSON-LD on any page, and no
      # iCal export exists), so this reads HTML too.
      #
      # It costs MORE than Pioneer Square does, because the date, the venue and
      # the booking link are only on the individual event pages — one request
      # per event, so `within_days` in the config is what keeps a run to a
      # couple of minutes rather than the ~630 rows the calendar publishes.
      #
      # What it buys is the one campus holding McCaw Hall, the Bagley Wright,
      # Cornish Playhouse, Fisher Pavilion, the Armory and the open grounds —
      # and roughly HALF of what it lists is free. Free courtyard concerts,
      # community commemorations and public art walks are precisely the supply
      # the ticketing APIs do not carry. Climate Pledge Arena is deliberately
      # skipped, because Ticketmaster already has it; the config says why.
      - name: Import Seattle Center (campus calendar, HTML)
        run: |
          if [ -f seattlecenter_sources.json ]; then
            python mapsee_ingest_seattlecenter.py --config seattlecenter_sources.json --store feeds_events.json
          else
            echo "no seattlecenter_sources.json — skipping"
          fi
      # The second Seattle neighbourhood association, and NOT a scraper: the
      # calendar is a SvelteKit island over a public admin-ajax action that
      # returns real JSON and answers our own User-Agent. Added because the
      # neighbourhood's biggest free event — the South Lake Union Block Party —
      # was missing from a catalogue that held 395 other Seattle events for that
      # weekend. Free street parties are exactly what the ticketing APIs do not
      # have, which is the whole argument for hyperlocal sources.
      - name: Import Discover South Lake Union (Seattle neighbourhood calendar, JSON)
        run: |
          if [ -f slu_sources.json ]; then
            python mapsee_ingest_slu.py --config slu_sources.json --store feeds_events.json
          else
            echo "no slu_sources.json — skipping"
          fi
      - name: Import 'The Events Calendar' sites (WordPress REST — comedy, running clubs, nature orgs)
        run: |
          if [ -f tribe_sources.json ]; then
            python mapsee_ingest_tribe.py --config tribe_sources.json --store feeds_events.json
          else
            echo "no tribe_sources.json — skipping"
          fi
      - name: Import Gancio instances (DIY/social-centre calendars, mostly EU)
        run: |
          if [ -f gancio_sources.json ]; then
            python mapsee_ingest_gancio.py --config gancio_sources.json --store feeds_events.json
          else
            echo "no gancio_sources.json — skipping"
          fi
      - name: Import Mobilizon instances (federated event software, FR/CH/IT)
        run: |
          if [ -f mobilizon_sources.json ]; then
            python mapsee_ingest_mobilizon.py --config mobilizon_sources.json --store feeds_events.json
          else
            echo "no mobilizon_sources.json — skipping"
          fi
      # Brazil's only working national events commons, and the only source in
      # this repo that puts anything on the map there. Two instances, ~1,900
      # occurrences read, under a minute — small enough to belong in `feeds`
      # rather than needing its own job the way OpenActive did. Read the
      # adapter's header before adding an instance: more than half of them
      # accept the date filter and ignore it, and the count that comes back is
      # then the whole archive.
      - name: Import Mapas Culturais (BR state/municipal cultural registers)
        run: |
          if [ -f mapasculturais_sources.json ]; then
            python mapsee_ingest_mapasculturais.py --config mapasculturais_sources.json --store feeds_events.json || true
          else
            echo "no mapasculturais_sources.json — skipping"
          fi
      - name: Import Moshtix (AU/NZ music + live events, public GraphQL)
        run: python mapsee_ingest_moshtix.py --store feeds_events.json --within-days 120 || true
      - name: Import Opendatasoft civic events (international; OpenAgenda + city portals)
        run: |
          if [ -f ods_sources.json ]; then
            python mapsee_ingest_ods.py --config ods_sources.json --store feeds_events.json || true
          else
            echo "no ods_sources.json — skipping"
          fi
      # CKAN is the only discovery path outside the United States, and this is
      # the adapter that ingests what it finds. It was never wired in: the
      # curation sweep can merge a verified CKAN source into ckan_sources.json
      # and, until this step existed, nothing would ever have read it — the
      # catalog would grow a country's supply on paper and ingest none of it.
      # The file does not exist until the first merge writes it, hence the guard.
      - name: Import CKAN civic events (data.gov.uk, open.canada.ca, data.gov.ie, ...)
        run: |
          if [ -f ckan_sources.json ]; then
            python mapsee_ingest_ckan.py --config ckan_sources.json --store feeds_events.json || true
          else
            echo "no ckan_sources.json yet — nothing merged from the CKAN sweep"
          fi
      - name: Sync feeds to Supabase (batch-geocoded)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          echo "sync mode: ${ONLY_NEW:-FULL REFRESH (updates all events)}"
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no feeds ingested — nothing to sync"
          fi
      # One market reaches the map from a curated list, OpenStreetMap AND the USDA
      # directories, and those sources run on different weekdays into a store that is
      # rebuilt each run — so the duplicates only ever meet here, in the table.
      #
      # EVERY category now, not just market. Markets were the case somebody
      # measured, never the only one: on 2026-08-12 the table held 4,871
      # duplicate rows across fifteen categories, and markets were 2,107. Being
      # the largest share DESPITE being the only category swept is what a job
      # falling behind looks like from outside.
      #
      # continue-on-error, NOT `|| true`. Both keep the pipeline going; only one
      # leaves a mark. `|| true` discarded the exit code, so a run that hit its
      # budget with rows still queued — or refused on --max-cluster — was
      # indistinguishable from a clean sweep. The step now goes red while the job
      # carries on to link-series, which still has to run.
      #
      # 600s, up from 300, matching the script's own default: the listing pass
      # alone walks ~193k rows.
      - name: Collapse duplicate imported events
        continue-on-error: true
        run: python mapsee_dedupe_events.py --max-seconds 600
      # A weekly market publishes each Saturday as its own listing and nothing tied
      # them together, so the map drew forty rows as forty separate things and Nearby
      # listed the same market forty times. Runs AFTER the dedupe, so it never chains
      # rows that were about to be deleted. Here rather than in the ingest for the same
      # reason as above, plus one more: --only-new means a sync sees this week's
      # occurrence and not the thirty already in the table.
      - name: Chain repeating listings into one series
        run: python mapsee_link_series.py --max-seconds 300 || true
      # A market geocode decides that market's FINGERPRINT, so it has to be
      # committed to be stable — an entry that lives only in the warm cache is one
      # eviction away from re-geocoding to a different cell and filing the market a
      # second time. That is what happened to all 48 inline markets on 2026-08-04.
      # Only entries missing from git are reported; the check is advisory (a new
      # source should not break the nightly run) and the dedupe sweep above is the
      # backstop. Commit what it prints.
      - name: Flag market geocodes that are not committed yet
        run: |
          python - <<'PY'
          import json, subprocess
          def load(s):
              try:
                  return json.loads(s)
              except Exception:
                  return {}
          live = load(open("geocode_cache.json", encoding="utf-8").read())
          head = load(subprocess.run(["git", "show", "HEAD:geocode_cache.json"],
                                     capture_output=True, text=True).stdout)
          new = sorted(k for k in live
                       if k.endswith("|market") and k not in head)
          if not new:
              print(f"All {sum(k.endswith('|market') for k in live)} market geocodes are committed.")
          else:
              print(f"::warning::{len(new)} market geocode(s) resolved this run are NOT in git. "
                    "Until committed their fingerprints can drift and duplicate the market. "
                    "Commit geocode_cache.json with these entries:")
              for k in new:
                  print(f"  {k} -> {live[k]}")
          PY
      # Feed the warm cache back to actions/cache from the merged file, so the
      # other adapters' lookups persist. Identity no longer depends on this.
      - name: Refresh the warm geocode cache
        if: always()
        run: cp geocode_cache.json geocode_cache.warm.json

  # RunSignup: the whole 'running' and 'fitness' supply.
  #
  # WHY ITS OWN JOB rather than another step in `feeds`. It ingests ~12,500
  # events in one pass — more than every ICS feed combined — behind ~5 minutes of
  # API paging, and `feeds` shares ONE store that is synced at the very end. A
  # job cancelled at its timeout mid-loop throws away everything it had ingested,
  # so hanging this off the end of the longest job in the workflow would put the
  # two emptiest lenses behind the most likely thing to be cut off. Separate job,
  # separate store, its own sync: a bad morning at RunSignup costs RunSignup.
  #
  # No geocode cap and no Photon: the races are US and carry street addresses, so
  # they geocode through the US Census BATCH endpoint (up to 9,000 per request),
  # not the 1.1s-per-venue path the `feeds` cap exists for.
  races:
    name: Races (RunSignup + BikeReg — running, cycling, fitness)
    runs-on: ubuntu-latest
    # Daily cron + manual, alongside `feeds`; skipped on the Mon/Thu heavy cron.
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # Failure-tolerant like every other ingest: a dead API is a quiet day for
      # two lenses, not a red workflow. source-health.yml is what notices.
      - name: Import RunSignup races
        run: |
          set +e
          python mapsee_ingest_runsignup.py --config runsignup_sources.json \
                                            --store races_events.json
          exit 0
      # Same job and the SAME STORE as RunSignup, deliberately: both are national
      # registration platforms feeding the same lens, and a rider looking at
      # wegosie should not be able to tell which one an event came from. Sharing
      # the store also means the fingerprint dedupe sees both, so a duathlon
      # listed on each platform merges instead of pinning twice.
      #
      # Adds no geocoding load to the sync: every BikeReg row arrives with the
      # feed's own coordinates and coords_exact set, so it skips the Census pass
      # that the RunSignup rows above go through.
      - name: Import BikeReg races and rides (cycling — the empty half of wegosie)
        run: |
          set +e
          python mapsee_ingest_bikereg.py --config bikereg_sources.json \
                                          --store races_events.json
          exit 0
      - name: Sync races to Supabase (batch-geocoded via US Census)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          echo "sync mode: ${ONLY_NEW:-FULL REFRESH (updates all events)}"
          if [ -f races_events.json ]; then
            python mapsee_supabase_sync.py --store races_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no races ingested — nothing to sync"
          fi

  # OpenStreetMap marketplaces, on their own, for the same reason `races` is on
  # its own: this one source costs more than every other feed in the repo put
  # together. 245 Overpass bboxes at roughly 45s each — query, the endpoint's
  # 429/504 backoff, and a deliberate pause so a free service is not hammered —
  # is over three hours, against about a minute for the rest of
  # market_sources.json.
  #
  # It lived inside `feeds` until 2026-08-17, when that job hit its 240-minute
  # ceiling in the middle of the markets step. The checkpoint sync sits AFTER
  # that step, so the run delivered nothing at all: not the markets, not the
  # Socrata and ICS work that had already finished, and not the twenty-odd
  # sources queued behind it. A source that cannot finish must not be able to
  # take the others down with it.
  #
  # Worth the runner time: measured over six metros the sweep yields 352 markets
  # and 3,684 occurrences, and the whole `market` category currently holds 3,469
  # upcoming events — fleabop is the thinnest lens on the map.
  # ITS OWN JOB, and this one is measured rather than assumed. Put inside
  # `feeds` it ran 31 minutes — which is honest work (RPDE pages from the
  # OLDEST end, so every one of the 12 publishers is walked to its end) and it
  # was 31 minutes added to the critical path of a job that already took 3h29m
  # against a 240-minute cap. On its first real run that tipped `feeds` to
  # EXACTLY 4h00m and the runner cancelled it mid-step, losing
  # mapsee_link_series for the day. Everything before it had already synced, so
  # the damage was small and it would have recurred every single night.
  #
  # Nothing about it wants to be in `feeds`: no shared cursor, no shared
  # geocode cache (every row carries coords_exact, so the Census pass skips
  # them), and its own store means the fingerprint dedupe has nothing to gain
  # from sharing one. Same reasoning as `markets_osm` — a long sweep belongs
  # beside the others, not inside one.
  openactive:
    name: OpenActive (UK leisure, community sport and volunteering sessions)
    runs-on: ubuntu-latest
    # Daily cron + manual, alongside `feeds`; skipped on the Mon/Thu heavy cron.
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # ~35,500 upcoming sessions from 12 publishers, all CC-BY 4.0 and all
      # carrying their own coordinates — which is what makes them cheap:
      # outside the US the sync cannot geocode, so a source that brings no
      # lat/lon places nothing. Into `fitness`, `sports` and (GoodGym)
      # `volunteer`, the three thinnest columns coverage reports.
      #
      # --horizon-days guards against Let's Ride's year-2500 sentinel dates.
      - name: Import OpenActive sessions
        run: |
          set +e
          if [ -f openactive_sources.json ]; then
            python mapsee_ingest_openactive.py \
              --config openactive_sources.json --store openactive_events.json
          else
            echo "no openactive_sources.json — skipping OpenActive"
          fi
          exit 0
      - name: Sync OpenActive to Supabase (rows carry coords — no geocoding)
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          echo "sync mode: ${ONLY_NEW:-FULL REFRESH (updates all events)}"
          if [ -f openactive_events.json ]; then
            python mapsee_supabase_sync.py --store openactive_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no openactive_events.json — nothing was pulled this run"
          fi

  markets_osm:
    name: OSM marketplaces (fleabop — its own job; the sweep is 3h+)
    runs-on: ubuntu-latest
    # Daily cron + manual. market_sources.json's own run_weekdays pins the sweep
    # to Mon+Thu, so on the other five days this job starts, prints one skip
    # line and exits in seconds.
    if: ${{ github.event.inputs.extra_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 6 * * *') }}
    # Comfortably over the measured 3h, and under the 6h hosted-runner ceiling.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # Failure-tolerant like every other ingest: a bad day at Overpass is a
      # quiet day for one lens, not a red workflow.
      - name: Sweep OpenStreetMap marketplaces
        run: |
          set +e
          python mapsee_ingest_markets.py --config market_sources.json \
                                          --type overpass \
                                          --store osm_market_events.json
          exit 0
      # No geocoding: every OSM row arrives with the feed's own surveyed
      # coordinates and coords_exact set, so the sync's Census pass skips them.
      - name: Sync OSM markets to Supabase
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          echo "sync mode: ${ONLY_NEW:-FULL REFRESH (updates all events)}"
          if [ -f osm_market_events.json ]; then
            python mapsee_supabase_sync.py --store osm_market_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no OSM markets ingested — nothing to sync"
          fi

  extra_sources:
    name: SeatGeek + Eventbrite + NPS + Localist + Sports
    runs-on: ubuntu-latest
    # only on the Mon/Thu cron + manual dispatch — NOT the daily cron (this is the heavy job)
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '40 6 * * 1,4' }}
    timeout-minutes: 120
    # same per-run geocode cap (TheSportsDB venue lookups) so this job also finishes
    # and persists its cache instead of timing out mid-backlog
    env:
      GEOCODE_MAX_NEW: "1200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # Side path, then merged under the committed file — same reasoning as the
      # feeds job. This job runs no market adapter, but it shares the cache file,
      # and restoring straight onto it would overwrite the committed `|market`
      # entries with whatever the warm copy happened to hold.
      - name: Restore warm geocode cache (TheSportsDB venue lookups)
        uses: actions/cache@v4
        with:
          path: |
            geocode_cache.warm.json
            ics_feed_cache.json
          key: geocode-cache-extra-${{ github.run_id }}
          restore-keys: geocode-cache-
      - name: Merge the warm geocode cache UNDER the committed one
        run: |
          python - <<'PY'
          import json
          def load(p):
              try:
                  with open(p, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return {}
          warm, tracked = load("geocode_cache.warm.json"), load("geocode_cache.json")
          merged = {**warm, **tracked}          # committed entries always win
          with open("geocode_cache.json", "w", encoding="utf-8") as fh:
              json.dump(merged, fh, ensure_ascii=False, indent=1, sort_keys=True)
              fh.write("\n")
          print(f"warm={len(warm)} committed={len(tracked)} merged={len(merged)}")
          PY
      - name: SeatGeek + DICE + AXS metro sweep (skipped wholesale when no keys are set)
        run: |
          set +e
          # every adapter here needs a key/token — if NONE are present the 50-metro
          # loop is pure no-op churn (200 python starts), so skip it entirely
          if [ -z "${SEATGEEK_CLIENT_ID}${DICE_API_KEY}${AXS_API_KEY}" ]; then
            echo "no SeatGeek/Meetup/DICE/AXS keys set — skipping the metro sweep"; exit 0
          fi
          METROS=()
          while IFS= read -r _L; do METROS+=("$_L"); done < <(sed -E 's/#.*//; s/[[:space:]]//g' metros_us.txt | grep -E '^-?[0-9.]+,-?[0-9.]+$')
          echo "US metros loaded: ${#METROS[@]}"
          for LL in "${METROS[@]}"; do
            R=25; case "$LL" in "38.9072,-77.0369"|"47.6062,-122.3321") R=100;; esac   # DC + Seattle — wide metros
            [ -n "$SEATGEEK_CLIENT_ID" ] && python mapsee_ingest_seatgeek.py --latlong "$LL" --radius "$R" --within-days 90 --store extra_events.json
            [ -n "$DICE_API_KEY" ]       && python mapsee_ingest_dice.py    --latlong "$LL" --radius "$R" --within-days 90  --store extra_events.json
            [ -n "$AXS_API_KEY" ]        && python mapsee_ingest_axs.py     --latlong "$LL" --radius "$R" --within-days 120 --store extra_events.json
          done
          exit 0                         # a trailing skipped-adapter guard ([ -n "$AXS_KEY" ]) must not fail the step + skip the sync
      - name: NPS + Recreation.gov + Localist + TheSportsDB (Localist + sports run without any key)
        run: |
          set +e
          python mapsee_ingest_nps.py --within-days 90 --store extra_events.json
          # Recreation.gov (RIDB): federal recreation land BEYOND the national
          # parks — Forest Service, BLM, Army Corps, Reclamation. The adapter and
          # the RECREATION_GOV_KEY env entry both already existed; the line that
          # actually RUNS it never did, so it has never once executed. Keyless it
          # no-ops in a line, exactly like the ticketing adapters above.
          [ -n "$RECREATION_GOV_KEY" ] && python mapsee_ingest_recreation.py --within-days 120 --store extra_events.json
          [ -f localist_sources.json ]    && python mapsee_ingest_localist.py    --config localist_sources.json    --store extra_events.json
          [ -f thesportsdb_leagues.json ] && python mapsee_ingest_thesportsdb.py --config thesportsdb_leagues.json --store extra_events.json
          exit 0                         # trailing "[ -f … ] && python" must not fail the step + skip the sync
      - name: Pull Eventbrite organizer events (official API — no-ops without EVENTBRITE_API_TOKEN)
        env:
          EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
        run: |
          if [ -f eventbrite_organizers.json ]; then
            python mapsee_ingest_eventbrite.py --config eventbrite_organizers.json --store eventbrite_events.json || true
          else
            echo "no eventbrite_organizers.json — skipping"
          fi
      - name: Sync extra sources + Eventbrite to Supabase
        run: |
          ONLY_NEW="--only-new"
          [ "$(date -u +%u)" = "3" ] && ONLY_NEW=""   # Wednesday refresh — see the first sync step
          [ "${{ github.event.inputs.full_refresh }}" = "true" ] && ONLY_NEW=""
          if [ -f extra_events.json ]; then
            python mapsee_supabase_sync.py --store extra_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no extra sources ingested — nothing to sync"
          fi
          if [ -f eventbrite_events.json ]; then
            python mapsee_supabase_sync.py --store eventbrite_events.json --skip-unchanged $ONLY_NEW || true
          else
            echo "no Eventbrite events ingested — nothing to sync"
          fi
      # Only the warm copy is saved; the committed file stays as git has it.
      - name: Refresh the warm geocode cache
        if: always()
        run: cp geocode_cache.json geocode_cache.warm.json

  # ---------------------------------------------------------------------------
  # Tell the search engines what just landed.
  #
  # Runs LAST and unconditionally. `needs` here is ordering, not a gate: every
  # ingest job above is deliberately failure-tolerant and several are
  # conditional on the cron, so `if: always()` is what makes this submit the
  # events that DID land on a run where one leg failed, timed out or was skipped
  # — which is the normal case, not the exceptional one. (extra_sources has been
  # cancelled mid-loop at its timeout before; the ~42k events it had already
  # ingested were still in the table and still deserved announcing.)
  #
  # No secret is read. mapsee_indexnow.py uses the public anon key on purpose, so
  # it can only ever see what an anonymous crawler could see. That also means
  # this job is safe to leave running if the repo's secrets are ever rotated.
  indexnow:
    name: Submit new event URLs to IndexNow
    runs-on: ubuntu-latest
    # `races` belongs here even though it arrived from a different branch than
    # this job: it is the single largest contributor of new URLs in a run
    # (~12,500 events), so an indexnow that does not wait for it announces
    # everything EXCEPT the biggest batch, and does it while looking healthy.
    # Anything added to `jobs:` from here on has to be added to this list too.
    #
    # markets_osm is here on the same reasoning and with one caveat: on the two
    # days its sweep actually runs it can take three hours, so this job waits
    # that long before announcing anything. That is the right trade — an
    # IndexNow ping is not time-critical, and the alternative is announcing
    # everything EXCEPT a sweep that yields thousands of URLs. On the other five
    # days markets_osm exits in seconds and costs this job nothing.
    needs: [ticketmaster, meetup, feeds, races, markets_osm, extra_sources]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      # 26h, not 24: the daily cron is at 06:17 UTC and a run that starts late or
      # takes an hour must not leave a gap. Re-submitting a URL an engine has
      # already seen is a no-op; missing one costs it its whole crawlable life.
      - name: Submit
        run: python mapsee_indexnow.py --since-hours 26
