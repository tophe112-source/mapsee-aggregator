# Find the real "order pickup" link for food venues.
#
# Runs AFTER the ingest (06:17) and BEFORE cleanup (08:23), so it sees the food
# events that landed this morning and does not spend fetches on rows that are
# about to be deleted.
#
# WEEKLY, on Wednesday, after osm-food's Tuesday 05:10 sweep. It ran daily and
# re-fetched the sites of the same 400 soonest food events with no memory of
# the day before: 11 consecutive runs (2026-09-03..09-13) examined 34-78 venues,
# fetched 54-104 third-party pages each, and found 0 order links; the two runs
# before them found 1 each. A restaurant's ordering page does not change
# overnight, and every one of those fetches is a visit to somebody else's site.
#
# Never add pull_request: this reads SUPABASE_SERVICE_ROLE_KEY, which bypasses
# RLS. Same rule as every workflow here except tests.yml.
name: Order links for food venues

on:
  schedule:
    - cron: "40 7 * * 3"           # Wednesdays: after osm-food (Tue 05:10) and the 06:17 ingest, before cleanup (08:23)
  workflow_dispatch:
    inputs:
      limit:
        description: "Events to examine (venues are deduped from these)"
        required: false
        default: "400"
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  menu-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What may be called an "Order pickup" link, before anything writes one.
      # This job puts a BUTTON on the map that promises you can place an order;
      # it shipped wrong twice already (400 of 400 pointing at Meetup, then a
      # bare /menu path matching a town website's nav), so the guard runs first.
      - name: Order-link honesty tests
        run: python test_menu_links.py

      - name: Find order links
        run: |
          python mapsee_menu_links.py \
            --limit ${{ github.event.inputs.limit || 400 }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --verbose
