name: Source health

# Every ingest job in this repo is deliberately failure-tolerant — `set +e`,
# bare `exit 0`, `|| true` — so that one dead feed cannot abort a sweep of
# forty others. That is the right call, and it has one bad consequence:
# aggregate-events.yml reports GREEN whether or not it ingested anything.
# A rotated Ticketmaster key or a feed that starts 403ing produces a
# successful run, zero new events, and no signal to anyone.
#
# This workflow is the missing signal. It does not re-run the ingest; it asks
# the database what actually landed and complains when a source that used to
# deliver has gone quiet. The sensor (the /stats snapshot + curation_ledger.json)
# already existed — nothing was ever scheduled to read it.
#
# Notification is a GitHub issue rather than Slack or a webhook, deliberately:
# it needs no secret, no external account and no maintenance, and GitHub
# already emails the repo owner when an issue is opened or commented. One open
# issue is reused for as long as the problem persists, so a source that stays
# broken for a week produces one thread, not seven.
#
# TWO THREADS, NOT ONE. The check exits 1 when a SOURCE is unhealthy and 2 when
# the CHECK ITSELF could not run, and those go to different issues. The first
# eight runs of this workflow all failed on a dead RPC and all filed under
# "one or more sources have gone quiet" — four days of a thread whose title
# contradicted every comment in it, describing an outage that was not happening
# while the real fault (a statement timeout, named in a response body nobody
# printed) went unnamed. A check that cannot run has to say so in those words.
#
# Triggers are schedule + workflow_dispatch ONLY. Never add pull_request:
# this job reads SUPABASE_SERVICE_ROLE_KEY, which must never be exposed to
# untrusted fork code.

on:
  schedule:
    # 08:40 UTC daily — after the 06:17 daily sweep and the 06:40 Mon/Thu heavy
    # sweep have both had time to finish and sync. Cheap: one RPC call.
    - cron: "40 8 * * *"
    # Sundays 04:10 UTC — the deep probe. catalog_curate.py audit re-fetches
    # every curated feed, so it is slow and network-heavy; weekly, off-peak,
    # and on a day the heavy sweep does not run.
    - cron: "10 4 * * 0"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Record the CURRENT state as the healthy baseline (do this only after a run you trust)"
        type: boolean
        default: false
      run_audit:
        description: "Also run the deep catalog audit (slow — re-probes every curated feed)"
        type: boolean
        default: false

concurrency:
  group: source-health
  cancel-in-progress: false

permissions:
  contents: write      # to commit a refreshed baseline
  issues: write        # to open / comment / close the health issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- baseline refresh (manual only) ---------------------------------
      - name: Update baseline
        if: ${{ inputs.update_baseline }}
        run: |
          python mapsee_health_check.py --update-baseline
          if ! git diff --quiet -- source_health_baseline.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source_health_baseline.json
            git commit -m "Refresh source health baseline"
            git push
          else
            echo "baseline unchanged"
          fi

      # --- the check ------------------------------------------------------
      # continue-on-error so a detected problem does not abort the job before
      # the issue is filed. The exit code is captured and acted on below:
      #   0 healthy · 1 a source is unhealthy · 2 the check could not run.
      #
      # --seed-baseline writes source_health_baseline.json only when it is
      # absent. It was absent for every run this workflow has ever done, and
      # SILENT / MISSING / DRAINED all compare against it — so on the days the
      # RPC did answer, this job would have passed having evaluated nothing at
      # all. A green tick from a check with no baseline means "no opinion", and
      # it looked exactly like "healthy".
      - name: Check ingest health
        if: ${{ !inputs.update_baseline }}
        id: health
        continue-on-error: true
        run: |
          set +e
          python mapsee_health_check.py --seed-baseline --markdown health_report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ !inputs.update_baseline }}
        run: cat health_report.md >> "$GITHUB_STEP_SUMMARY" || true

      # A seeded baseline is worthless uncommitted: the next run would find the
      # file missing again and re-seed for ever, and the check would never
      # actually compare anything.
      #
      # continue-on-error for the same reason the notifier tolerates a missing
      # report. This step pushes, and a push can lose a race with the curation
      # job; under `set -e` that would abort the job BEFORE the issue is filed,
      # which is precisely the "the alarm died on its way to ringing" failure
      # this workflow has already been bitten by once. A missed baseline commit
      # costs one re-seed next run. A missed alarm costs the alarm.
      - name: Commit a seeded baseline
        if: ${{ !inputs.update_baseline }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if git diff --quiet --ignore-matching-lines='"taken_at"' -- source_health_baseline.json \
             && ! git status --porcelain -- source_health_baseline.json | grep -q '^??'; then
            echo "baseline unchanged"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_health_baseline.json
          git commit -m "Seed the source health baseline, so the check has something to compare against"
          git push

      # --- notify ---------------------------------------------------------
      # `gh` is preinstalled on the runner. Using it directly rather than a
      # third-party action keeps a job that holds the service-role key free of
      # any marketplace dependency.
      - name: Open or update the health issue
        if: ${{ !inputs.update_baseline && steps.health.outputs.status != '0' }}
        env:
          STATUS: ${{ steps.health.outputs.status }}
        run: |
          set -euo pipefail
          # Exit 2 is "nothing was evaluated", which is a different problem with
          # a different fix and belongs in its own thread under its own label.
          if [ "$STATUS" = "2" ]; then
            TITLE="Ingest health: the check itself cannot run"
            LABEL="ingest-health-check"
            COLOR="D93F0B"
            LABEL_DESC="The health check could not evaluate anything"
          else
            TITLE="Ingest health: one or more sources have gone quiet"
            LABEL="ingest-health"
            COLOR="B60205"
            LABEL_DESC="A source has stopped delivering events"
          fi
          {
            if [ "$STATUS" = "2" ]; then
              echo "**The health check could not run.** It did not evaluate a single"
              echo "source, so nothing here says the pipeline is unhealthy — only that"
              echo "the alarm is off. Fix this first; until it is fixed, a genuinely"
              echo "dead feed would go unreported."
            else
              echo "One or more event sources have stopped delivering. The aggregate"
              echo "workflow will still be reporting success — it is failure-tolerant"
              echo "by design — so this issue is the only signal."
            fi
            echo
            # NEVER let a missing report kill the notifier. This step runs on any
            # non-zero exit, and `cat` of an absent file under `set -e` took the
            # whole job down with "cat: health_report.md: No such file" — so the
            # one run that most needed to raise an alarm raised nothing but a red
            # tick. mapsee_health_check.py now writes a report on every failing
            # path; this is the belt to that pair of braces.
            if [ -s health_report.md ]; then
              cat health_report.md
            else
              echo "**The check exited non-zero without writing a report.**"
              echo
              echo "That is a fault in the check itself, not a finding about any"
              echo "source — nothing was evaluated. See the run log for the cause."
            fi
            echo
            echo "---"
            echo "_Checked by [\`source-health\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC'). This issue closes itself once the condition clears._"
          } > issue_body.md

          EXISTING=$(gh issue list --label "$LABEL" --state open \
                       --json number --jq '.[0].number // empty')

          # The label must exist before it can be applied; ignore "already exists".
          gh label create "$LABEL" --color "$COLOR" \
            --description "$LABEL_DESC" 2>/dev/null || true

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file issue_body.md
          else
            echo "Opening a new issue"
            gh issue create --title "$TITLE" --label "$LABEL" --body-file issue_body.md
          fi

      # An exit-1 run proves the check RAN, so the "cannot run" thread is stale
      # whatever the sources are doing. Closing it only on a fully-green run
      # would leave it open through every genuine source outage.
      - name: Close the "cannot run" issue once the check runs again
        if: ${{ !inputs.update_baseline && steps.health.outputs.status != '2' }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label ingest-health-check --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "The health check ran and evaluated every source as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing; any finding about the sources themselves is on the \`ingest-health\` thread."
            gh issue close "$EXISTING"
          fi

      - name: Close the health issue when everything recovers
        if: ${{ !inputs.update_baseline && steps.health.outputs.status == '0' }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label ingest-health --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "All baseline sources are delivering again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$EXISTING"
          fi

      # Fail the job last, so the issue is always filed first. A red run in the
      # Actions tab is a second, independent signal alongside the issue email.
      - name: Fail if unhealthy
        if: ${{ !inputs.update_baseline && steps.health.outputs.status != '0' }}
        env:
          STATUS: ${{ steps.health.outputs.status }}
        run: |
          # Say WHICH of the two it is. "Ingest health check failed" was true of
          # both and useful for neither: it sent everyone looking for a dead feed
          # when the finding was that no feed had been looked at.
          if [ "$STATUS" = "2" ]; then
            echo "::error::The ingest health check could not run - NO source was evaluated. See the open ingest-health-check issue."
          else
            echo "::error::A source has stopped delivering - see the open ingest-health issue."
          fi
          exit 1

  # The deep probe. Where the `check` job asks the database what landed, this
  # one asks every curated feed whether it is still alive, and records the
  # answer in curation_ledger.json. That ledger is what lets dead feeds be
  # skipped until their TTL lapses — it was only ever refreshed by hand, so it
  # drifted, and the "N feeds marked dead" line in the daily report was stale.
  audit:
    # Sunday's cron, or an explicit manual request.
    if: ${{ github.event.schedule == '10 4 * * 0' || inputs.run_audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Never fail the job on a bad feed: a dead source is the expected finding
      # here, not an error. The ledger diff is the output that matters.
      - name: Re-probe every curated feed
        run: |
          set +e
          python catalog_curate.py audit | tee audit.log
          exit 0

      - name: Commit the refreshed ledger
        run: |
          set -euo pipefail
          if git diff --quiet -- curation_ledger.json; then
            echo "ledger unchanged"; exit 0
          fi
          DEAD=$(python -c "import json;d=json.load(open('curation_ledger.json'));print(sum(1 for v in d.values() if v.get('status')=='fail'))")
          TOTAL=$(python -c "import json;print(len(json.load(open('curation_ledger.json'))))")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curation_ledger.json
          git commit -m "Weekly catalog audit: ${DEAD}/${TOTAL} feeds dead"
          git push
          {
            echo "### Weekly catalog audit"
            echo
            echo "**${DEAD} of ${TOTAL}** curated feeds are not returning usable data."
            echo
            echo '```'
            grep -E "^\[XX " audit.log | head -60 || echo "(no failures listed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
