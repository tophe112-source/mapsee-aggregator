name: Hide duplicate imported events (manual)

# The nightly run of mapsee_dedupe_events.py is the `dedupe` job in
# aggregate-events.yml. This is the same script by hand: a report, a bounded
# first write, or the undo of one run.
#
# workflow_dispatch ONLY. Never add a pull_request trigger: this repo is public
# and that would expose SUPABASE_SERVICE_ROLE_KEY to fork code.
#
# MODES
#   report         list what would be hidden; write nothing (the default)
#   apply          hide the copies (hidden_at + duplicate_of), after giving each
#                  kept row its copies' categories. REFUSED unless the
#                  repository variable DEDUPE_APPLY is 'bounded' (then days and
#                  lookback are at most 7 each: the bounded first write) or
#                  'true' (any horizon; the nightly job then hides too). The
#                  script itself also reports (and exits 1) while
#                  events.duplicate_of does not exist.
#   unhide-report  list the copies one run hid (needs `stamp`, from that run's
#                  report or log: "Mode: APPLY (hidden_at=...)")
#   unhide         put them back: clears hidden_at and duplicate_of on exactly
#                  that run's copies. Allowed with the switch off, because the
#                  undo has to work on the day the switch was turned off.
#
# Inputs reach the shell through env, never pasted into `run:`, and days and
# lookback are each checked on their own: digits only, not empty, at most 120.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional repo variable: DEDUPE_APPLY ('bounded' allows a bounded apply here
# only; 'true' allows any apply here and arms the nightly job). The six rollout
# steps are in docs/agents/sync-eventstore-and-paging.md and ../mapsee 0236.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report | apply (needs DEDUPE_APPLY=bounded, days/lookback <= 7, or =true) | unhide-report | unhide"
        type: choice
        options: [report, apply, unhide-report, unhide]
        default: report
      days:
        description: "Forward horizon in UTC days (report/apply)"
        type: string
        default: "21"
      lookback:
        description: "Rows that started up to this many days ago and are still running (report/apply)"
        type: string
        default: "60"
      stamp:
        description: "unhide modes: the hidden_at stamp of the run to reverse, e.g. 2026-10-14T06:41:07+00:00"
        type: string
        default: ""

concurrency:
  group: dedupe-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: The rules about to be applied still pass their own tests
        run: python test_dedupe_events.py
      - name: Run
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          DAYS: ${{ inputs.days }}
          LOOKBACK: ${{ inputs.lookback }}
          STAMP: ${{ inputs.stamp }}
          APPLY_SWITCH: ${{ vars.DEDUPE_APPLY }}
        run: |
          set -o pipefail
          # Each number on its own: digits only, not empty, at most MAX_DAYS. A
          # number bash cannot compare (2^63, an empty field) made `[ -gt ]` fail,
          # the `if` read that as false, and the bounded apply went ahead.
          MAX_DAYS=120
          for v in "$DAYS" "$LOOKBACK"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::days and lookback must each be a whole number (got '$DAYS' and '$LOOKBACK')"; exit 2 ;;
            esac
            if [ "${#v}" -gt 3 ] || [ "$v" -gt "$MAX_DAYS" ]; then
              echo "::error::days and lookback must each be at most $MAX_DAYS (got '$DAYS' and '$LOOKBACK')"; exit 2
            fi
          done
          case "$MODE" in
            report)
              ARGS=(--days "$DAYS" --lookback "$LOOKBACK" --max-seconds 1200 --report dedupe_report.json) ;;
            apply)
              case "$APPLY_SWITCH" in
                true) ;;
                bounded)
                  # fails closed: anything but two numbers of 7 or less is refused
                  if ! { [ "$DAYS" -le 7 ] && [ "$LOOKBACK" -le 7 ]; } 2>/dev/null; then
                    echo "::error title=Dedupe: refused::DEDUPE_APPLY is 'bounded': days and lookback must be 7 or less (got $DAYS and $LOOKBACK). Set it to 'true' for a wider apply."
                    exit 1
                  fi ;;
                *)
                  echo "::error title=Dedupe: refused::mode apply needs the repository variable DEDUPE_APPLY set to 'bounded' or 'true' (it is '${APPLY_SWITCH:-unset}')."
                  exit 1 ;;
              esac
              ARGS=(--apply --days "$DAYS" --lookback "$LOOKBACK" --max-seconds 1200 --report dedupe_report.json) ;;
            unhide-report|unhide)
              if [ -z "$STAMP" ]; then
                echo "::error::the unhide modes need the stamp of the run to reverse"
                exit 2
              fi
              ARGS=(--unhide --stamp "$STAMP" --show 200)
              if [ "$MODE" = "unhide" ]; then ARGS+=(--apply); fi ;;
            *)
              echo "::error::unknown mode '$MODE'"; exit 2 ;;
          esac
          echo "MODE: $MODE"
          python -u mapsee_dedupe_events.py "${ARGS[@]}" | tee dedupe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedupe-report
          path: |
            dedupe_report.json
            dedupe.log
          retention-days: 30
          if-no-files-found: ignore
