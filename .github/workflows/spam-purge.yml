name: Purge spam events

# Deletes aggregator-imported rows that are advertisements rather than events,
# and clears end dates so far out that mapsee_cleanup.py could never reach the
# row. Scoped to external_source='mapsee' — community events are never matched.
#
# schedule + workflow_dispatch ONLY. Never add a pull_request trigger: this repo
# is public and that would expose SUPABASE_SERVICE_ROLE_KEY to fork code.
#
# IT WRITES NOTHING UNTIL THE OWNER TURNS IT ON, AND THE SWITCH IS NOT IN THIS
# FILE. The switch is the repository variable SPAM_PURGE_APPLY (Settings ->
# Secrets and variables -> Actions -> Variables). While it is anything but
# exactly 'true', the 07:40 schedule does not run at all (see the job's `if`),
# and a manual run REPORTS what it would delete and changes nothing. With it set
# to 'true', the schedule deletes, and a manual run deletes only if its
# report_only box is unticked. Delete the variable, or set it to anything else,
# and it is off again. No code change and no push, either way.
#
# Why a switch as well as the share ceiling: this deletes production rows on a
# CONTENT judgement, and no destructive run had been approved when it merged. The
# ceiling is what makes a delete safe to leave running; the switch is what makes
# the first one a decision rather than a side effect of a push to main. The
# first step says which mode it chose and why — as an annotation on the run
# page, in the log, and at the top of the job summary.
#
# WHY THIS IS STILL NEEDED NOW THE GATE EXISTS. mapsee_spam.py stops new rows at
# ingest, and it reaches nothing already stored — `--only-new` is the default in
# CI, so a scheduled run can only ADD, and Wednesday's full run re-reads the
# SOURCES rather than re-applying our rules to rows we already hold. There is
# also a steady inflow: curate-catalog.yml discovers and adds new instances every
# week, and an open-registration instance can be spammed the day after it is
# added. So this is not a one-off backfill with an expiry date.
#
# WHERE IT SITS IN THE DAY, and the order is the point:
#
#   06:17  aggregate-events    imports; the gate refuses new spam at the door
#   07:40  THIS                deletes old spam, and clears the ends that make a
#                              past row permanent (a report until switched on)
#   08:23  cleanup-events      deletes what has finished — which now includes
#                              everything this un-dated an hour earlier
#
# Most of what this touches is therefore removed by the EXISTING janitor rather
# than by a delete here. Run it after cleanup instead and every un-dated row
# waits a full day for its own removal.
#
# WHAT A SCHEDULED RUN READS. A full walk read 744,093 rows in 1,261 s
# (2026-09-14) to find 227 deletes. The scheduled run now passes --state: it
# reads the visible rows CREATED since its last complete run began (less 3 h),
# and walks the whole table only when it has no state, when mapsee_spam.py or
# mapsee_spam_purge.py changed, and once the last complete full walk is a week
# old. Same rules, same ceiling, same switch; the state is one small file in
# its own Actions cache pair. A manual run passes no --state and is the full
# walk, as before. mapsee_spam_purge.py's "THE DAILY RUN" block says what
# waits for the weekly walk.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional repo variable: SPAM_PURGE_APPLY ('true' allows writes; anything else reports)

on:
  schedule:
    - cron: "40 7 * * *"        # daily, between the import and the janitor
  workflow_dispatch:
    inputs:
      report_only:
        description: "Report only. Unticked, this deletes ONLY if the repository variable SPAM_PURGE_APPLY is 'true'"
        type: boolean
        default: true
      max_share:
        description: "Ceiling on the share of rows read that may be deleted (default 0.05)"
        type: string
        default: "0.05"

concurrency:
  group: spam-purge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    # The SCHEDULE does not run at all while the switch is off. A report-only
    # walk is not free: on 2026-09-14 it read all 744,093 aggregator rows in
    # 1,261 s (05:48-06:09Z), and a daily table scan whose report nobody reads
    # is load on the database during the ingest window for nothing. Manual runs
    # always work, and report unless the switch is on and report_only is unticked.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SPAM_PURGE_APPLY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # FIRST, so the mode is on the run page before anything else happens.
      # APPLY needs the variable to be exactly 'true' AND, on a manual run, an
      # unticked report_only. Everything else — the variable unset, 'TRUE',
      # 'yes', a typo, a step output that never arrived — is a report, because
      # the default has to be the one that cannot delete.
      - name: Decide the mode (report unless SPAM_PURGE_APPLY is 'true')
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLY_SWITCH: ${{ vars.SPAM_PURGE_APPLY }}
          REPORT_ONLY_INPUT: ${{ inputs.report_only }}
        run: |
          if [ "$APPLY_SWITCH" != "true" ]; then
            MODE=report
            WHY="the repository variable SPAM_PURGE_APPLY is '${APPLY_SWITCH:-unset}', not 'true'"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REPORT_ONLY_INPUT" != "false" ]; then
            MODE=report
            WHY="a manual run with report_only ticked"
          else
            MODE=apply
            WHY="SPAM_PURGE_APPLY is 'true' and this $EVENT_NAME run did not ask for a report"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "=================================================================="
          if [ "$MODE" = "apply" ]; then
            echo "SPAM PURGE MODE: APPLY. This run DELETES rows in production: $WHY."
            echo "::warning title=Spam purge: APPLY::This run deletes advertisements and clears implausible end dates in production: $WHY."
          else
            echo "SPAM PURGE MODE: REPORT ONLY. Nothing will be written: $WHY."
            echo "::notice title=Spam purge: REPORT ONLY::Nothing will be written: $WHY. Deletes need the repository variable SPAM_PURGE_APPLY set to 'true'."
          fi
          echo "=================================================================="

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests

      # WHAT THE LAST COMPLETE SCHEDULED RUN READ, so this one reads only what
      # arrived since (mapsee_spam_purge.py, "THE DAILY RUN READS WHAT ARRIVED
      # SINCE THE LAST ONE"). The same pair as prune-cancelled's URL index:
      # restore the newest entry under the prefix, save under the file's own
      # hash and only when it is not the copy restored. Evicted, missing or
      # unreadable costs one full walk, which is what every run was before.
      # Only the SCHEDULE passes --state (below): a manual run is always the
      # full walk and never writes the file, so a report or a one-off cannot
      # move the daily run's starting point.
      - name: Restore the purge state
        id: purge-state
        uses: actions/cache/restore@v4
        with:
          path: spam_purge_state.json
          key: spam-purge-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spam-purge-state-

      # The predicate is graded here too, on the runner that is about to use it.
      # It costs two seconds and it is the difference between "the tests passed
      # on the commit" and "the rules that are about to delete rows are the ones
      # that passed". A red test must stop the delete, not merely be noticed.
      - name: The rules about to be applied still pass their own tests
        run: python test_spam.py

      # --max-seconds is PAIRED with timeout-minutes above, the same pairing
      # cleanup-events.yml documents: the script stops cleanly inside its own
      # budget and leaves the rest for tomorrow, rather than being killed
      # mid-batch by the job timeout. The gap covers checkout, setup-python, pip
      # and the test step. Move one, move the other.
      #
      # 1800 s against 35 minutes, not the 1000 s against 25 it started with: a
      # full walk read 744,093 rows in 1,261 s on 2026-09-14, so 1000 s stopped
      # before the end of the table every time.
      #
      # 1800 s is still the FULL walk's budget: it runs weekly, after a change
      # to the rules, and whenever the state is missing. The daily run reads
      # the rows created since the last complete one and ends long before it.
      #
      # --apply is passed ONLY when the mode step said exactly "apply". Inputs
      # reach the shell through env, never pasted into the script.
      #
      # --state is passed ONLY to a scheduled run (github.event.schedule is
      # empty on a dispatch).
      #
      # `tee` rather than a redirect: the log is the thing somebody reads when
      # this goes wrong, and a summary that exists only in the job summary tab is
      # one more place to look. Both, from one run.
      #
      # set -o pipefail, or the exit code of the script is thrown away by tee and
      # the tripwire below can never fail the job — which is the entire point of
      # having a tripwire.
      - name: Purge
        id: purge
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          MAX_SHARE: ${{ inputs.max_share || '0.05' }}
          FIRED_BY: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          STATE_FLAG=""
          if [ -n "$FIRED_BY" ]; then
            STATE_FLAG="--state spam_purge_state.json"
          fi
          APPLY_FLAG=""
          if [ "$MODE" = "apply" ]; then
            APPLY_FLAG="--apply"
            echo "MODE: APPLY (--apply passed)"
          else
            echo "MODE: REPORT ONLY (no --apply)"
          fi
          python mapsee_spam_purge.py \
            --max-seconds 1800 \
            --max-share "$MAX_SHARE" \
            $STATE_FLAG \
            $APPLY_FLAG \
            | tee purge.log

      # The script rewrites the file only after a complete --apply run whose
      # writes all landed; anything else leaves the restored copy, whose hash
      # is the key it came from, and nothing is saved.
      - name: Save the purge state
        if: ${{ always() && hashFiles('spam_purge_state.json') != '' && steps.purge-state.outputs.cache-matched-key != format('spam-purge-state-{0}', hashFiles('spam_purge_state.json')) }}
        uses: actions/cache/save@v4
        with:
          path: spam_purge_state.json
          key: spam-purge-state-${{ hashFiles('spam_purge_state.json') }}

      # always(), because the run worth reading is the one that REFUSED. A
      # tripwire that trips and leaves nothing on screen has told nobody
      # anything; the titles it printed are the evidence for whether the rules
      # or the sources changed.
      - name: Summary
        if: always()
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          WHY: ${{ steps.mode.outputs.why }}
        run: |
          {
            echo "### Spam purge"
            echo ""
            if [ "$MODE" = "apply" ]; then
              echo "**Mode: APPLY.** This run was allowed to delete: $WHY. The log below says what it did, including a refusal at the share ceiling."
            else
              echo "**Mode: REPORT ONLY.** Nothing was written: ${WHY:-the mode step did not run}."
              echo ""
              echo "Deletes need the repository variable \`SPAM_PURGE_APPLY\` set to \`true\`."
            fi
            echo ""
            echo '```'
            tail -c 60000 purge.log 2>/dev/null || echo "(no output — the run failed before the purge step)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
