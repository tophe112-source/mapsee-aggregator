# The civic things a neighbourhood already has, from OpenStreetMap.
#
# The third sibling of osm-food.yml and osm-secondhand.yml. Read osm-food's
# header for the matrix-from-config and the cursor slice/merge/commit dance,
# and osm-secondhand's for why there is no sequential warm pass. What follows
# is only what DIFFERS.
#
# MOST OF WHAT THIS WRITES IS FURNITURE, and that is the design. A drinking
# fountain has nothing to say beyond being a drinking fountain, so its row is
# marked pin_only and ../mapsee 0194 draws it and does nothing else — no sheet,
# no Nearby row, no sitemap entry. The ingest prints the listing/furniture split
# per area on every run, because a sweep that adds only furniture has still made
# the map more useful and being able to SEE that is the point.
#
# LIKE ITS SIBLINGS, THIS FETCHES NOBODY'S WEBSITE. Overpass is the only service
# we are a guest on, so --max-places bounds run time rather than politeness.
#
# SUNDAYS. osm-food takes Overpass on Tuesday and osm-secondhand on Saturday;
# aggregate-events runs its heavy sweep Mon/Thu and its full refresh Wednesday.
# Two of our own workflows tiling Overpass at once means backing off politely
# against our own traffic.
#
# Never add pull_request: reads SUPABASE_SERVICE_ROLE_KEY via the sync step.
name: OSM civic amenities

on:
  schedule:
    - cron: "40 5 * * 0"          # Sundays, clear of osm-food (Tue) and osm-secondhand (Sat)
  workflow_dispatch:
    inputs:
      only:
        description: "One area by name (blank = all)"
        required: false
        default: ""
      kinds:
        description: "Restrict to these selectors, e.g. leisure=playground,social_facility=food_bank"
        required: false
        default: ""
      max_places:
        description: "Elements examined per area (no page fetch; bounds run time only)"
        required: false
        default: "4000"
      radius_miles:
        description: "Override every hub's radius for this run (blank = config)"
        required: false
        default: ""
      listings_only:
        description: "Skip furniture — only elements carrying a fact worth reading"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        required: false
        default: false
      # `full_refresh` USED TO LIVE HERE and is gone: rewriting existing rows
      # is now what every run of this workflow does, scheduled or dispatched,
      # for the reason spelled out on the Sync step. What it also used to do —
      # restart the sweep at candidate 0 — was a SEPARATE knob wearing the same
      # switch, and fusing them made a backfill impossible to finish. See the
      # note on the Pull step.
      restart_cursor:
        description: "start this area from its FIRST candidate again (does not save the cursor)"
        type: boolean
        required: false
        default: false
      retire_thin_artwork:
        description: "CLEANUP: hide anonymous artwork rows already written (an upsert cannot delete)"
        type: boolean
        required: false
        default: false

# ONE RUN AT A TIME, for osm-food.yml's reason: two runs write the same Supabase
# rows and both try to commit the cursor, and the `cursor` job is `if: always()`.
concurrency:
  group: osm-amenities
  cancel-in-progress: false

permissions:
  contents: write   # the cursor job commits osm_amenity_cursor.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      areas: ${{ steps.pick.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("osm_amenity_sources.json", encoding="utf-8"))
          only = (os.environ.get("ONLY") or "").strip().lower()
          names = [a["name"] for a in cfg["areas"]
                   if not only or only in a["name"].lower()]
          print("areas=" + json.dumps(names))
          PY
      - run: echo "Running ${{ steps.pick.outputs.areas }}"

  pull:
    needs: plan
    runs-on: ubuntu-latest
    # Minutes, not hours: no third-party page fetches, and coords_exact=True on
    # every row means the sync does not geocode them either.
    timeout-minutes: 60
    strategy:
      fail-fast: false            # one metro's bad day is not the sweep's
      max-parallel: 4             # be a guest, and do not stampede the sync
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # REQUIRED by the sync: the profile imported events are created_by.
      MAPSEE_HOST_PROFILE_ID: ${{ secrets.MAPSEE_HOST_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # ONE CACHE ENTRY PER AREA, rolling on run_id and restoring by prefix —
      # osm-secondhand's design and its reasons. The `-vN` is the manual bust:
      # the ingest self-heals a changed bbox but cannot see a changed SELECTOR,
      # so bump it whenever KINDS gains or loses an entry.
      #
      # v2: `amenity=toilets` joined KINDS. The first run after that change
      # restored a one-day-old element list fetched by the OLD query, reported
      # "7211 element(s) from cache", and imported not one toilet — a silent
      # no-op that looks exactly like a successful sweep. This comment said to
      # bump it and I did not.
      - name: Cache ${{ matrix.area }}'s amenity list
        uses: actions/cache@v4
        with:
          path: osm_amenity_cache
          key: osm-amenity-v2-${{ matrix.area }}-${{ github.run_id }}
          restore-keys: |
            osm-amenity-v2-${{ matrix.area }}-

      # THE SPLIT IS THE RISK IN THIS ADAPTER. Marking a real listing as
      # furniture makes its opening hours unreachable; marking furniture as a
      # listing puts every bench in the metro in somebody's Nearby list. Both
      # are silent. The hours test is osm-food's, because that is whose parser
      # this imports — and refusing an unreadable string matters most of all
      # rules, because ignoring "shut" advertises a place as open.
      - name: The listing/furniture split, and the hours we may act on
        run: |
          python test_ingest_osm_amenities.py
          python test_osm_food.py

      # THE ONE ORDERING THIS JOB CANNOT SURVIVE. ../mapsee 0194 adds
      # events.pin_only, and it is what keeps furniture OUT of events_near and
      # out of the Nearby list. Run this against a database that has not had
      # the migration applied and every drinking fountain in the metro lands as
      # an ordinary event — millions of them, crowding the list the product
      # exists to show, and an upsert cannot take them back out.
      #
      # The sync itself now survives the missing column (it drops it and says
      # so, so one late migration cannot cost all thirty-seven adapters their
      # night). That is the right behaviour THERE and the wrong one here, where
      # the column is not a nice-to-have but the entire point of the adapter.
      # So this job refuses to start instead.
      - name: Refuse to run before ../mapsee 0194 is applied
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/events?select=pin_only&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$code" != "200" ]; then
            echo "::error::events.pin_only is not in this database (HTTP $code)."
            echo "::error::$(head -c 300 /tmp/probe.json)"
            echo "::error::Apply ../mapsee migrations 0194, 0195 and 0196 first —"
            echo "::error::without pin_only every amenity lands as an ordinary event."
            exit 1
          fi
          echo "events.pin_only present — safe to import furniture."

      # `--ignore-cursor` BELONGS TO restart_cursor, NOT TO full_refresh, and
      # fusing them made a backfill impossible to finish. The ingest reads
      # `cursor = {} if a.ignore_cursor else load_cursor(...)` and then refuses
      # to SAVE one — so every run with it starts at candidate 0 and leaves the
      # cursor where it was. Dispatching "full refresh" ten times therefore
      # re-swept the same first window ten times and never reached the rest.
      #
      # Measured after one such run, on the icon backfill 0205 needed: Seattle
      # 278 of 1,000 sampled furniture rows still had a NULL icon, London 689,
      # Paris 618. A backfill wants ADVANCE + REWRITE, which is exactly the
      # combination the fused input could not express.
      #
      # So they are orthogonal now: full_refresh drops --only-new (rewrite what
      # this run touches), restart_cursor passes --ignore-cursor (go back to the
      # beginning). Repeating full_refresh now walks the whole catalogue.
      - name: Pull ${{ matrix.area }}
        run: |
          python mapsee_ingest_osm_amenities.py \
            --config osm_amenity_sources.json --store feeds_events.json \
            --only "${{ matrix.area }}" \
            --max-places ${{ github.event.inputs.max_places || 4000 }} \
            ${{ github.event.inputs.kinds && format('--kinds {0}', github.event.inputs.kinds) || '' }} \
            ${{ github.event.inputs.radius_miles && format('--radius-miles {0}', github.event.inputs.radius_miles) || '' }} \
            ${{ github.event.inputs.listings_only == 'true' && '--listings-only' || '' }} \
            ${{ github.event.inputs.restart_cursor == 'true' && '--ignore-cursor' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Sync to Supabase
        id: sync
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # THIS ADAPTER ALWAYS REWRITES, and the old comment here had the
          # reason while drawing the wrong conclusion from it: "--only-new is
          # right for the WEEKLY run and exactly wrong for a backfill... pin_only
          # is written on EVERY row, so an OSM mapper adding opening hours to a
          # playground only takes that pin out of furniture on a full refresh."
          #
          # That is not a backfill footnote, it is a permanent staleness bug.
          # Every column this adapter writes is DERIVED FROM OSM — pin_only,
          # icon, the hours, the description — so with --only-new a row is
          # frozen as of the day it was first seen and no edit anybody makes to
          # OpenStreetMap ever reaches it. The playground that gained opening
          # hours stays furniture for ever. 0205's icon backfill is the same
          # shape and is what made it visible.
          #
          # Three things make rewriting safe and bounded rather than reckless:
          #   * the sync's own Claimed-guard drops any row a venue has claimed
          #     before writing, so an owned listing is never overwritten;
          #   * --max-places bounds the WINDOW, so a run rewrites at most that
          #     many places per area however often it runs;
          #   * the cursor advances, so successive runs walk the catalogue
          #     rather than re-writing the same window (which is precisely what
          #     --ignore-cursor used to prevent — see the Pull step).
          #
          # The cost is blast radius: a regression in to_row now reaches rows
          # that already exist, not only new ones. That is the trade, taken
          # deliberately, because the alternative is a map that can never
          # correct itself.
          #
          # ...AND "REWRITE" IS NOT "REWRITE EVERYTHING", which the first
          # version of this step got wrong and paid for on the READ side. An
          # UPDATE that writes identical bytes still costs a dead tuple, a WAL
          # record, an index entry and a relocated live row — and almost every
          # row here IS identical, because nobody edits a given drinking
          # fountain twice in a month. ../mapsee measured what that does:
          # `events` is 993 MB of heap against a 256 MB shared_buffers, London's
          # events_near reads 30,279 rows off 20,597 heap pages (1.47 rows per
          # page), and query time is simply `reads x ~0.9 ms`. Rows arrive in
          # INGEST order, so rewriting one moves it to the end of the table and
          # smears a city's set further apart — a sweep that rewrites tens of
          # thousands of rows a night is the one thing here that makes that
          # worse on purpose.
          #
          # --skip-unchanged reads each row back and sends only the ones that
          # DIFFER. It fails toward writing in every direction (a refusal, a
          # column the server does not return, a value it cannot normalise all
          # read as changed), so being wrong costs one wasted UPDATE rather than
          # an OSM edit that silently never lands — which is the --only-new
          # staleness this whole step exists to escape. test_skip_unchanged.py.
          ONLY_NEW=""
          echo "syncing WITHOUT --only-new: existing rows are rewritten from current OSM,"
          echo "but --skip-unchanged means only the ones that actually differ are written"
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json --skip-unchanged $ONLY_NEW
          else
            echo "no feeds_events.json — nothing was pulled this run"
          fi

      # A FAILED STEP SKIPS EVERY STEP AFTER IT, INCLUDING THE ONE THAT SAVES
      # THE WORK — the same shape as a `timeout-minutes` cancellation, and it
      # happened here: run 12 swept Seattle, synced it, and then died on a
      # NameError in the artwork cleanup, which has nothing to do with this
      # metro. Seattle's cursor slice was never produced and never handed up,
      # so the sweep it had just paid for would be repeated next week while
      # the other seven metros moved on.
      #
      # Two fixes and both are worth having. The cleanup now runs at the END
      # of the job, so nothing unrelated sits between the sweep and its
      # bookkeeping; and these gate on the SYNC's own outcome rather than on
      # "did everything before me pass". Not a bare always(): a cursor must
      # advance only over work that actually reached the table.
      - name: Take this area's cursor slice
        if: ${{ always() && steps.sync.outcome == 'success' }}
        env:
          AREA: ${{ matrix.area }}
        run: |
          python - <<'PY'
          import json, os
          area = os.environ["AREA"]
          try:
              cur = json.load(open("osm_amenity_cursor.json", encoding="utf-8"))
          except Exception:
              cur = {}
          slice_ = {area: cur[area]} if area in cur else {}
          json.dump(slice_, open("cursor_slice.json", "w", encoding="utf-8"), sort_keys=True)
          print("handing up", slice_)
          PY

      - name: Hand up the cursor
        if: ${{ always() && steps.sync.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cursor-${{ strategy.job-index }}
          path: cursor_slice.json
          if-no-files-found: ignore
          retention-days: 1

      # AN UPSERT CANNOT DELETE, so refusing anonymous wall tags at ingest does
      # nothing about the ones already written — the sweep simply stops
      # re-writing them and they sit there for ever. hidden_at rather than
      # DELETE, so it is reversible (`--unhide`); dry by default in the script,
      # so `--apply` is what this passes.
      #
      # On the `plan` job's first matrix entry only: it walks the whole table
      # rather than one metro, so running it eight times in parallel would be
      # eight identical passes racing each other.
      - name: Retire anonymous artwork rows already in the table
        if: ${{ github.event.inputs.retire_thin_artwork == 'true'
                && strategy.job-index == 0
                && github.event.inputs.dry_run != 'true' }}
        run: python mapsee_retire_thin_artwork.py --apply

  cursor:
    needs: pull
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cursor-*
          path: cursors
        continue-on-error: true
      # RE-MERGE ONTO THE LATEST main EACH ATTEMPT, and retry — osm-food's
      # lesson: a sweep takes a while, and any push to main in that window
      # rejects a commit built against the checkout from run start.
      - name: Merge and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main        # cursors/ is untracked, so it survives
            python - <<'PY'
          import glob, json, os
          merged = {}
          if os.path.exists("osm_amenity_cursor.json"):
              merged = json.load(open("osm_amenity_cursor.json", encoding="utf-8"))
          for p in sorted(glob.glob("cursors/**/cursor_slice.json", recursive=True)):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception as exc:
                  print(f"skipping {p}: {exc}")
                  continue
              if len(d) > 1:
                  print(f"::warning::{p} carries {len(d)} areas, expected 1: {sorted(d)}")
              merged.update(d)
          json.dump(merged, open("osm_amenity_cursor.json", "w", encoding="utf-8"),
                    indent=1, sort_keys=True)
          print(json.dumps(merged, indent=1, sort_keys=True))
          PY
            git add osm_amenity_cursor.json
            if git diff --staged --quiet; then
              echo "cursor unchanged — nothing to commit"
              exit 0
            fi
            git commit -m "osm-amenities: advance the cursor [skip ci]"
            if git push; then
              echo "cursor pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); re-merging onto the new head"
            sleep $((attempt * 5))
          done
          echo "::error::could not push the cursor after 5 attempts"
          exit 1
