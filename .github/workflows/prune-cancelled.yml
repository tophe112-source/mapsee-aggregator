name: Prune cancelled events

# Re-probes UPCOMING aggregator rows at their own source URL and hides the ones
# the source has since called off — schema.org EventCancelled/EventPostponed, or
# a 404/410 on the listing. Every other cancellation check in this repo runs at
# ingest and so protects only rows not written yet; an upsert cannot delete, and
# --only-new means a scheduled run can only ADD. This is the other half.
#
# Measured 2026-09-13 over 502 Meetup-sourced rows sampled from the live
# sitemaps: 47 cancelled, 18 deleted — 12.9% of the Meetup events on the map.
#
# WHERE IT SITS IN THE DAY, and the order is load-bearing:
#   06:17  aggregate-events      the import
#   07:40  menu-links (Wed)      order links, after the import
#   07:55  THIS (near horizon,   hide what the source has called off
#          full budget; Sundays
#          the full sweep)
#   08:23  cleanup-events        the janitor deletes what is past
#   16:55  THIS (near horizon)   catch TODAY's cancellations before tonight
# After the import, so a row written this morning is checked this morning.
# Before the janitor, so a cancelled event that is also past is deleted outright
# rather than left hidden for a week.
#
# THE MORNING RUN READS 2 DAYS ON SIX DAYS AND 120 ON SUNDAY. Measured on the 7
# morning full sweeps 2026-10-20..10-26 (jobs 118642658041 .. 121635448161):
# every one printed CAPPED "through" its own run date, so the 4,000 URLs it may
# probe were all today's, the same set a --days 2 run picks (its first window
# is the same query). To pick them it read 662,579-686,946 rows with their
# descriptions (4.72 M a week), 841-1,921 s of its 2,100 s budget, and lost 3-4
# windows a day to HTTP 500s at OFFSET 37.5k-49.5k (3 tries each); probing got
# the rest, 284-1,525 URLs. The 16:55 --days 2 run read 41.5k-46.5k rows in
# 131-225 s. So the far 118 days added no probe. What they did add is reach:
# a listing found off hides EVERY collected row that shares its URL, and at
# least 143 of the week's 360 hides (40%) were such later rows, from two
# leisure-centre timetables (Tenby, 10-20; Pembroke, 10-22) and one multi-day
# stage (10-26).
#
# THE TRADE: six mornings read about 44k rows instead of about 674k (about
# 3.8 M fewer rows a week, about 90 fewer minutes of reads in the 12:15-15:00
# UTC hours the morning collect ran in, about 50 fewer failed statements), and
# the ~900 s each gives back goes to probing, roughly 950 more probes a
# morning at the measured ~1.05 a second. The Sunday sweep keeps the reach: it
# hides all 120 days of every listing IT finds off. A listing found off on
# another day hides only its rows inside 48 hours; its later rows wait for a
# run that probes the same URL again, the next Sunday's at the latest IF that
# sweep reaches it. That is not guaranteed: the Sunday run probes soonest
# first like every run (284-1,525 of its 4,000 in the measured week), and a
# near run that has just hidden a listing's next 48 hours pushes its first
# start out of Sunday's day 0. Not measured; re-measure from the logs (the
# CALLED OFF tables) before calling far hides safe. A manual run with days
# blank is the full sweep too, for a listing that cannot wait for Sunday.
#
# WHY THERE ARE TWO RUNS. A once-daily sweep cannot catch a SAME-DAY
# cancellation, and that is the case that actually costs somebody an evening.
# Found the hard way on 2026-09-13: the reported row ("Seattle Gay Online Speed
# Dating") started at 22:00 UTC that night, its Meetup listing already said
# EventCancelled, and the next sweep was not until 07:55 the following
# morning — six hours after the event was due to END. Hiding it then is
# bookkeeping, not a fix. The 12.9% measured above is the standing STOCK; this
# second run is about the FLOW, where a cancelled row does its damage.
#
# The near-horizon run passes --days 2, so it probes only what is happening
# inside 48 hours — a few hundred URLs rather than several thousand, minutes
# rather than half an hour. 16:55 UTC is 09:55 Pacific / 12:55 Eastern / 17:55
# UK: hours of warning for a US evening event, and still ahead of most UK ones.
# It is deliberately clear of festival-schedules at 17:23.
#
# It HIDES (hidden_at), it does not delete: reversible, no cascade through
# event_messages / event_rsvps / invites / cohosts — which matters most here,
# because somebody may have RSVP'd to the thing that got cancelled — and
# cleanup-events reaps it a week after it would have ended, like every other
# imported row.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: "55 7 * * *"        # daily ~07:55 UTC — --days 2, full budget; Sundays the FULL sweep
    - cron: "55 16 * * *"       # daily ~16:55 UTC — the NEAR HORIZON (--days 2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        default: false
      # Narrow a manual run to the next N days. Blank is the full sweep. Worth
      # having for the same reason the 16:55 cron exists: when something is
      # wrong TONIGHT, a two-day pass answers in minutes instead of spending the
      # whole probe budget on events four months out.
      days:
        description: "How far ahead to sweep, in days (blank = the full 120)"
        type: string
        default: ""
      # A BACKFILL, not a schedule — same shape as retire_thin_artwork riding on
      # osm-amenities.yml. mapsee_ingest now refuses an online-only listing at
      # the boundary, but an upsert cannot delete, so the ones already written
      # need one pass. Opt-in because it is a one-off: once it has run, the
      # ingest side keeps the map clean and running it again finds nothing.
      retire_online_events:
        description: "Also hide already-imported events whose listing says they are online only"
        type: boolean
        default: false

concurrency:
  group: prune-cancelled
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --max-seconds is PAIRED with timeout-minutes above: the script stops
      # probing inside its own budget, acts on what it has and leaves the rest
      # for tomorrow, rather than being killed mid-sweep by the job timeout. The
      # gap covers checkout, setup-python and the writes. Move one, move the other.
      #
      # github.event.schedule is the cron that FIRED, and it is the only thing
      # that tells the two scheduled runs apart. It is empty on a dispatch, so a
      # manual run is a full sweep unless it asks for a narrower one.
      #
      # PYTHONUNBUFFERED: block-buffered, the "scanned" line reached the log
      # only with "probed 50/4000" (121635448161, both 14:52:48.76), so every
      # collect time read from it included the first 50 probes.
      - name: Hide events the source has cancelled
        env:
          FIRED_BY: ${{ github.event.schedule }}
          DAYS_IN: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: |
          # A manual narrow run gets the FULL budget, not the short one. The
          # point of --days is to aim the sweep, not to cut it off: the first
          # live run showed 25,311 distinct URLs inside a three-day window, so
          # even two days is more than 900s of probing can finish, and stopping
          # early is how that run missed the event it was dispatched for.
          #
          # EVERY CRON HAS ITS OWN BRANCH and an unknown one fails, rather than
          # falling into the 120-day sweep (test_workflow_contracts pins both).
          # The weekday is read when the step runs, not when the cron fired:
          # the 07:55 run started 12:15-14:35 UTC in the measured week, still
          # the same UTC day.
          if [ -n "$DAYS_IN" ]; then
            SCOPE="--days $DAYS_IN"; BUDGET=2100   # a manual run, aimed
          elif [ -z "$FIRED_BY" ]; then
            SCOPE=""; BUDGET=2100                  # a manual run with days blank: the full sweep
          elif [ "$FIRED_BY" = "55 16 * * *" ]; then
            SCOPE="--days 2"; BUDGET=900           # the evening near-horizon pass
          elif [ "$FIRED_BY" = "55 7 * * *" ] && [ "$(date -u +%u)" = "7" ]; then
            SCOPE=""; BUDGET=2100                  # Sunday morning: the full 120-day sweep
          elif [ "$FIRED_BY" = "55 7 * * *" ]; then
            SCOPE="--days 2"; BUDGET=2100          # the other six mornings: same probes, ~1/15 of the reads
          else
            echo "::error title=Prune: no branch::the cron '$FIRED_BY' has no branch in this step; add one"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then APPLY=""; else APPLY="--apply"; fi
          echo "scope: ${SCOPE:-full} · budget: ${BUDGET}s · ${APPLY:-DRY RUN}"
          python mapsee_prune_cancelled.py --max-seconds "$BUDGET" $SCOPE $APPLY

      # always(): the step above spends its whole budget probing other people's
      # servers and can be cut short by the job timeout. This one reads only our
      # own table and takes seconds, so there is no reason for it to inherit
      # that risk.
      - name: Backfill — hide already-imported online-only events
        if: ${{ always() && inputs.retire_online_events == true }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The install lives HERE rather than in a step of its own, because the
          # scheduled path does not need it: mapsee_prune_cancelled is pure
          # stdlib on purpose, so the twice-daily run has no dependency to break.
          # This one shares looks_online_only with the adapter, so it imports
          # mapsee_ingest — which sys.exit()s without requests rather than
          # raising, so the failure reads as "This script needs 'requests'" and
          # not as a traceback. Caught before its first run; nothing else in the
          # job would have told us.
          pip install --quiet requests
          if [ "$DRY_RUN" = "true" ]; then APPLY=""; else APPLY="--apply"; fi
          python mapsee_retire_online_events.py $APPLY
