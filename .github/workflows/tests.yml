name: Tests

# The category classifier is the highest-consequence code in this repo and the
# hardest to eyeball. It decides which of the seven mapsee front doors an event
# reaches: a rule that is one word too greedy puts a food-bank repack shift on a
# nightlife map, and a rule that is one word too narrow starves a whole lens.
# Nothing about that failure is loud — the sweep still exits 0 and the events
# still land, just on the wrong door.
#
# test_categories.py and test_ingest_categories.py have existed and passed for a
# while. NOTHING RAN THEM. They were only ever executed by hand, which means the
# regression they were written to catch could ship on any commit that touched a
# regex, a promotion set or an adapter's category map.
#
# Cheap enough to run on every push: no network, no secrets, no database — the
# tests import the classifier and call it with literal strings. Under a minute.
#
# Deliberately NOT `on: schedule`. These test pure functions; they can only
# break when the code changes, so a nightly green run would be noise.

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# No secrets are read here, so pull_request from a fork is safe — this is the
# one workflow in the repo for which that is true. Read-only, explicitly.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Both scripts print one line per case and exit non-zero on any failure,
      # so the job log IS the report — no test runner needed to read it.
      - name: Category classifier (which lens an event reaches)
        run: python test_categories.py

      - name: Adapter categories (secondaries survive into the sync)
        run: python test_ingest_categories.py

      # Grouping rules only — no network, no database. Worth a gate because the
      # script WRITES to a shared column and its failure mode is silent: chain
      # two unrelated events and one of them vanishes from the map behind the
      # other, with nothing in any log to say so.
      - name: Series linking (which repeats are one thing)
        run: python test_link_series.py

      # The alarm, not the pipeline. source-health.yml failed its first eight
      # runs against a retired RPC and reported it as sources going quiet; both
      # halves of that — which endpoint is called, and whether the server's own
      # error text survives into the report — are asserted here against a faked
      # transport. No network and no database, same as the rest of this job.
      - name: Ingest health check (the alarm itself)
        run: python test_health_check.py
      # Placement, for the two adapters that are HANDED coordinates and so can
      # put an event confidently in the wrong city. Squarespace ships a default
      # pin in lower Manhattan for every event with no location set (17 of the
      # first 22 real events); Luma reports a postal code only inside a full
      # address line, where a naive search finds the street number. Both produce
      # well-formed, plausible, wrong rows that nothing downstream can catch.
      - name: Placement traps (Squarespace default pin, Luma address parsing)
        run: python test_ingest_places.py

      # Same family, different trap: South Lake Union's endpoint expands a
      # recurrence into one row per date but leaves `date_time` on the SERIES
      # start, so reading the obvious field puts every Saturday of a six-month
      # farmers market on the first Saturday in June. Plus `end_time` (a clock)
      # against `end_date` (the last day of a run), which turns a three-week
      # supply drive into an event that is always happening.
      - name: Date traps (SLU occurrence vs series start, end_time vs end_date)
        run: python test_ingest_slu.py

      # The same family again, third variant: a MyListing card carries TWO dates
      # and the obvious one is wrong. The inner span is the listing's NEXT date,
      # stamped identically into every card the listing produces, so reading it
      # collapses a fifty-night residency onto the same Friday fifty times; 55 of
      # 80 live cards disagreed between the two. Also pinned: the horizon, without
      # which annual events project pins to 2050 that no cleanup job can remove,
      # and an address with no street line, which the first version read as
      # city="Washington 98110", region="United States".
      - name: Date and address traps (MyListing occurrence vs next-date, horizon)
        run: python test_ingest_mylisting.py

      # Cycling, and three ways it goes quietly wrong. The offset on BikeReg's
      # startDate is the SERVER'S — a Kailua-Kona race carries -04:00 while its
      # own eventTimeZone says Hawaiian — so reading it as an instant moves the
      # race to the day before. One eventId comes back once per OCCURRENCE (39
      # of 1,246 ids), and since EventStore pops a record whose fingerprint
      # moved, a bare eventId makes each date delete the last: 1,269 in, 1,148
      # out. And the calendar sells club memberships alongside races, which are
      # pins where nothing is happening.
      - name: Cycling traps (BikeReg date offset, per-occurrence identity)
        run: python test_ingest_bikereg.py

      # The Overpass sweep is 245 bboxes against a free endpoint, so a handful
      # lose their slot every run — measured, New York and Los Angeles both came
      # back empty while six other metros answered. The loop used to move on,
      # and since this source runs twice a week that could hide the two largest
      # US markets for days behind one line of log. The second pass and its
      # COUNT are pinned here, along with the rule that a city is not a street.
      #
      # Plus the monthly schedules — "second Saturdays", "last Thursdays" — that
      # most flea and night markets actually run on. Every schedule this adapter
      # understood was weekly, and expanding a monthly market weekly invents four
      # pins for every real one, each on the right street at the right time. The
      # rule is pinned against Seattle Local Markets' own published date list,
      # including the edge that makes it worth pinning: "last" is not "fifth".
      - name: Market sweep survives a metro that loses its slot
        run: python test_ingest_markets.py

      # The Events Calendar returns `venue` as a dict, as [], and as [{...}] from
      # the SAME site, and `image` as a dict or the bare boolean false. `or {}`
      # covers the empty list and not the populated one — and the exception
      # unwound to the per-SITE handler, so one bad record cost the whole
      # calendar. Bicycle Colorado ingested 0 of 105 events that way, reporting
      # it in a line that looks like the host was down.
      - name: Feed shapes (one bad record must not cost a whole site)
        run: python test_ingest_tribe.py

      # The generic JSON-LD importer read WP Event Manager sites correctly by
      # ACCIDENT: schema.org says `location`, that plugin writes `Location`, so
      # the key was missed and the config's venue block filled the gap. Read the
      # key and its content bites — every one of The Royal Room's 95 pages says
      # {"name": "-", "address": "-"}, and "-" is truthy, so it survives the
      # gap-fill test and reaches the geocoder as a street. Also pinned: the
      # naive local startDate that is only an instant once the venue's
      # coordinates supply a timezone, and the closure notices a venue posts to
      # its own calendar, which are well-formed events that must not be on a map.
      - name: JSON-LD venue sites (placeholder locations, naive times, non-events)
        run: python test_ingest_jsonld.py

      # Discovery from the map. The trap it exists for: Squarespace and Wix match
      # on every page of every site built with them, so "detected Squarespace" is
      # not "found a calendar" — 4 of 5 failed candidates in the first London
      # sweep were Wix sites, one of which does not use Wix Events at all. Also
      # pins that a bot challenge answering 200 is still a refusal, and that a
      # refusal is not written into the ledger as a fact about the site.
      - name: OSM calendar discovery (builders vs plugins, challenges, candidate shape)
        run: python test_discover_osm.py

      # The CIVIC backend, and every rule in it is one a live sweep got wrong
      # first: a keep list that threw away "4th of July" and kept "Waste
      # Collection Events", closure calendars that pass a name test because
      # their entries are just "Christmas Day", a cursor advanced by
      # deduplicated cities when Wikidata's OFFSET counts rows, and four feeds
      # that verified perfectly and ingested nothing because Photon cannot read
      # "Venue - Street City ST ZIP". None of them is guessable from the code.
      - name: Civic calendar discovery (deny list, closure feeds, city-wide shape)
        run: python test_discover_civic.py

      # A state fair's website is marketing copy, so its dates are the headline
      # and so is everything that looks like them: a ticket sale window, a horse
      # show, and iowastatefair.org's table of every year since 1966 with the
      # YEAR LEADING each row, which reads left to right as the 2027 fair
      # labelled 2028. Every case in this file is an answer a live sweep got
      # wrong before the rule existed.
      - name: State fairs (sale windows, other events, the year in the wrong place)
        run: python test_ingest_fairs.py

      # OFFSET paging gets dearer every page: offset=6000 makes Postgres produce
      # and discard six thousand rows to return the next thousand. It held while
      # the catalog was small and died the day a 26-hour window held more than
      # 6,000 new events. Also pins that the server's own error body reaches the
      # report — "500 Server Error" alone cannot say whether to take a smaller
      # bite or wait for the edge, and those are opposite responses.
      - name: IndexNow paging (keyset not offset, and a 5xx that says which)
        run: python test_indexnow.py

      # ~2,965 free weekly volunteer-run events in 20 countries — the entire
      # 'running' layer. The adapter was written and wired in; its config file
      # was never committed, and the step is guarded `if [ -f ... ]`, so every
      # run since printed a friendly skip and nobody saw a red tick. This also
      # asserts no OTHER guarded source config is missing.
      - name: parkrun (a config a guarded job needs is part of the job)
        run: python test_ingest_parkrun.py

      # OpenActive: four ways a feed lies to a reader, and three of them look
      # exactly like a healthy read. RPDE pages from the OLDEST end, so page one
      # said "0 future sessions" for a live feed with 854 of them AND for one
      # dead since 2019; a ScheduledSession carries a date and no name; and one
      # publisher ships rides dated the year 2500, which cleanup can never
      # delete because 2500 is not past.
      - name: OpenActive (a feed's first page is its oldest, and it lies both ways)
        run: python test_ingest_openactive.py

      # Mapas Culturais, Brazil's state and municipal cultural registers. Three
      # of these lies are indistinguishable from a healthy read: a date filter
      # the server ACCEPTS and ignores (one instance answered a future-filtered
      # query with its whole archive, back to 1911), a coordinate that is
      # present and "0", and an address placeholder that is the literal word
      # "undefined". The first two decide whether a row is real and whether it
      # can be drawn at all.
      - name: Mapas Culturais (an accepted filter that never ran, and 0,0)
        run: python test_ingest_mapasculturais.py

      # An upsert cannot delete, so a collapse in the adapter leaves the rows it
      # replaced behind. This hides them — and the property that matters is that
      # it can never empty a venue-day: a slot row goes only where the collapsed
      # day row for that title, venue and date is already present.
      - name: OpenActive slot retirement (never empties a venue-day)
        run: python test_retire_openactive_slots.py

      # The listing/furniture split. A civic amenity with nothing worth reading
      # is DRAWN and nothing else; one that carries a fact opens like any pin.
      # Both errors are silent: mark a listing as furniture and its hours become
      # unreachable, mark furniture as a listing and every bench in the metro
      # takes a turn in somebody's Nearby list.
      - name: Civic amenities (which pins earn a sheet)
        run: python test_ingest_osm_amenities.py

      # A migration's CODE can merge before the migration has been RUN, and
      # nothing sequences a git merge against a hand-run `supabase db push`.
      # to_row writes every column for every adapter, so an unknown column used
      # to cost not one feature but the whole night: a 400 is not retryable, so
      # every batch fell through to row-by-row, every row failed identically,
      # and all thirty-seven adapters wrote zero having made fifty times the
      # requests to do it.
      - name: A column the database has not got yet costs one feature, not the night
        run: python test_sync_unknown_column.py

      # _post_retry read resp.status_code and nothing else, so it retried the
      # batch Supabase answered "503" to and let the batch Supabase answered
      # NOTHING to raise out of upsert() and kill the process. Same transient
      # condition, differing only in whether the answer beat the 30s read
      # timeout. On 2026-08-29 it failed two workflows from one line: the Meetup
      # sweep lost 4h50m of international metros, and OSM second-hand went with
      # it. The job already knew "a later timeout must not discard it" — it just
      # only enforced it between jobs, never between batches inside one sync.
      - name: An unanswered batch is a hole, not the end of the run
        run: python test_sync_transport_loss.py

      # An adapter whose every column is DERIVED from an upstream people edit
      # cannot use --only-new: the row freezes on the day it landed and no OSM
      # edit ever reaches it. Dropping the flag fixed that and made every run
      # rewrite tens of thousands of identical rows, each costing a dead tuple
      # and a relocated live row in a 993 MB table that already reads 1.47 rows
      # per heap page. Reading back first is the middle: what is asserted here
      # is the DIRECTION it fails in, because skipping a row that really changed
      # is invisible and permanent while writing one that did not is what the
      # code already did.
      - name: A rewrite writes what changed, and fails toward writing
        run: python test_skip_unchanged.py

      # Six adapters emit a bare YYYY-MM-DD when the source publishes no clock,
      # and each says in a comment that the row claims a DAY rather than a
      # minute. Nothing honoured it: a bare date in a timestamptz is read at the
      # SERVER's clock, so the Mariners' ballpark tour reached a phone in Seattle
      # as "Today, 5:00 PM -> Tomorrow, 4:59 PM" — the wrong two days, a
      # nineteen-hour window, and hours nobody published. Every all-day row on
      # earth was shifted by its venue's offset, in whichever direction.
      - name: An all-day row spans the day where the EVENT is
        run: python test_sync_all_day.py

      # "Order pickup" is a promise. It shipped once on 400 of 400 food events
      # that pointed at Meetup, and a second time on any /menu path — which
      # matched a town website's nav. Both regressions are pinned here.
      - name: Order-link honesty (what may be called "Order pickup")
        run: python test_menu_links.py

      # Two 5xx reach the janitor and want opposite things: a statement timeout
      # means take a SMALLER bite (retrying it unchanged stalls the run), an
      # upstream 503 means the request never happened (not retrying it turns a
      # provider blip into a red build). Both are >= 500, so telling them apart
      # is the whole job, and getting it backwards is silent either way.
      - name: Cleanup retries (statement timeout vs upstream outage)
        run: python test_cleanup.py

      # --collapse relaxes a safety rule (hide an old row even with no standing
      # replacement), and the way that goes wrong is a venue quietly vanishing,
      # which looks exactly like a venue that closed. The invariant is pinned:
      # at least one row survives at every venue, whatever the input order.
      - name: Per-day retirement never empties a venue
        run: python test_retire_perday.py

      # Opening hours decide when a takeaway pin is offered to somebody hungry.
      # Getting this wrong does not make a row look odd — it sends a person to a
      # locked door, so the REFUSALS matter more than the parses. An unreadable
      # "off" rule crashed the first live run, and shrugging one off would
      # advertise a closed shop as open.
      - name: Opening hours we may act on (OSM takeaway)
        run: python test_osm_food.py

      # The second-hand SELECTOR, which is that adapter's whole risk.
      # `second_hand=only` is 29,256 elements and 15,853 of them (55%) are
      # shop=car. Widen the allow-list by accident and a used-car dealership
      # lands on fleabop, whose first line of copy is about a jacket that fit
      # somebody else — and nothing downstream would catch it, because the row
      # would have a name, a coordinate, readable hours and a valid category.
      - name: Only second-hand shops reach fleabop (OSM second-hand)
        run: python test_osm_secondhand.py

      # The pruner EDITS live descriptions, so the rewrite is the risky half, not
      # the probing. It must never leave the lead sentence advertising a link it
      # has just removed, and must never touch a row whose destination was merely
      # unreachable rather than gone.
      - name: Pruning a dead link leaves an honest description
        run: python test_prune_links.py

      # The international sweep spawns its ingesters as subprocesses, and a
      # southern-hemisphere latlong starts with a minus that argparse reads as
      # an option. Australia, New Zealand and South Africa ingested nothing for
      # months while the run reported "swept 165 metros" and a green tick. The
      # argv FORM is what is pinned here, because the outcome was invisible.
      - name: Sweep argv survives a negative latitude
        run: python test_sweep_global.py

      # The repo's second HTML scraper, and every fact it needs is offered
      # twice with the obvious copy wrong. The listing groups cards under a
      # date heading carrying NO YEAR, on a calendar that runs seven months
      # ahead and so crosses New Year. Locations are Google Maps links whose
      # FIRST coordinate is the viewport centre, a constant 165m west of the
      # place — and on a detail page that link usually belongs to a different
      # event entirely. And a Saturday matinee shares a title, a venue and a
      # date with the evening show, which the shared date-keyed fingerprint
      # cannot separate: 59 events came out as 57 before that was fixed, both
      # casualties a real performance somebody holds a ticket to.
      - name: Seattle Center (yearless dates, borrowed coordinates, matinees)
        run: python test_ingest_seattlecenter.py

      # curate-catalog.yml holds a checkout for 30-90 minutes and then pushes,
      # so anything landing on main in that window used to kill the run at its
      # LAST step with every verified source in the bin — three times. The
      # commit step re-reads main and re-applies instead, and each of the four
      # files has its own merge rule; every way one of those can be wrong is
      # silent, from a cursor merged a level too high (months of walking reset,
      # file still valid) to an append that runs twice (one run counted twice in
      # the only trend anybody reads).
      - name: Re-applying a curation run onto a main that moved
        run: python test_curate_reapply.py

      # Every adapter is imported by the sweep at runtime; a syntax error or a
      # bad top-level import in one of the 25 of them currently surfaces as a
      # mid-sweep crash on a schedule, hours later. Compiling is not a test, but
      # it catches that class in seconds.
      - name: Every module at least compiles
        run: python -m compileall -q .
