# Are the pages we publish still fit to index?
#
# `source-health.yml` beside this one answers "is the catalog still filling up".
# This answers a different question with the same failure shape: the indexable
# surface is now ~1,000 landing pages per door across seven doors, all of it
# GENERATED by three functions in one Worker, and every way it can break returns
# HTTP 200 while it does so.
#
#   * a canonical starts pointing at a page that refuses to be indexed
#   * a route 404s after a regex change while the sitemap keeps announcing it
#   * a JSON-LD block stops parsing because a title contained a quote
#   * a page quietly loses its description
#
# Nothing fails in a deploy. The only evidence is a decline in Search Console
# weeks later - which is exactly the shape of problem this repo already decided
# was worth a scheduled job and a GitHub issue.
#
# Its OWN file rather than a third job in source-health.yml, deliberately: that
# workflow is large, actively edited, and the two have no shared setup worth the
# coupling.
name: SEO health

on:
  schedule:
    # Sundays 05:20 UTC. Weekly rather than daily because a regression here is
    # systematic - it arrives whole with a deploy or not at all - so a sample of
    # 60 URLs per door finds it as reliably as a crawl of a thousand. Offset an
    # hour past source-health's Sunday audit so the two do not overlap.
    - cron: "20 5 * * 0"
  workflow_dispatch:
    inputs:
      sample:
        description: "Pages to crawl per door"
        default: "60"

concurrency:
  group: seo-health
  cancel-in-progress: false

permissions:
  issues: write        # to open / comment / close the one health issue

jobs:
  seo:
    name: Crawl the published pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: seo-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt

      # Reads only, and uses no secret: every page it fetches is one a crawler
      # can fetch, which is the entire point of checking them. The seed is the
      # run number so the sample moves each week and the corpus gets swept over
      # time rather than the same 60 pages forever.
      - name: Crawl
        id: crawl
        run: |
          set +e
          python mapsee_seo_check.py \
            --sample "${{ github.event.inputs.sample || '60' }}" \
            --seed "${GITHUB_RUN_NUMBER}" | tee seo.log
          echo "failed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summary
        run: |
          {
            echo "### Published pages"
            echo
            echo '```'
            cat seo.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One open thread that gets commented on, not a new issue every week -
      # the same convention source-health.yml uses, because a weekly issue for a
      # problem that persists is a mailbox people learn to filter.
      - name: Open or update the issue
        if: steps.crawl.outputs.failed != '0'
        run: |
          set -euo pipefail
          { echo "The weekly crawl found problems on pages the sitemaps announce."
            echo
            echo '```'; cat seo.log; echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh label create "$LABEL" --color B60205 \
              --description "Published pages that stopped being indexable" 2>/dev/null || true
            gh issue create --title "Published pages: indexing regressions found" \
              --label "$LABEL" --body-file body.md
          fi

      - name: Close it when everything is clean again
        if: steps.crawl.outputs.failed == '0'
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "The weekly crawl found no problems as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$EXISTING"
          fi
