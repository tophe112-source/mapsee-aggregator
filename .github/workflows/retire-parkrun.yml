name: Retire parkrun rows (one-off)

# A BACKFILL, not a schedule: the one-run way to take every parkrun row off the
# map, or put them back. parkrun was parked for part of 2026-09-25 and run 5 hid
# the 17,870 rows it had imported; the owner then decided to show parkrun (the
# `_decision` note in parkrun_sources.json, and the README's Conduct section),
# and `apply` + `unhide` restored them. If parkrun ever asks us to stop, park the
# config (which stops the future) and dispatch with `apply`: an upsert cannot
# delete, so the rows already written need this pass.
#
# Dry run by default: read the list in the log, then dispatch again with
# `apply`. `unhide` reverses it. mapsee_retire_parkrun.py matches only rows
# carrying the adapter's own blurb, so a parkrun meetup somebody else published
# is never touched.
#
# Its own workflow rather than an input on prune-cancelled.yml, because a
# dispatch there also runs that job's full 35-minute probe sweep of other
# people's servers, which this has no reason to repeat.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write (hide the rows). Off = a dry run that only reports"
        type: boolean
        default: false
      unhide:
        description: "Reverse: un-hide what this hid (needs apply)"
        type: boolean
        default: false

concurrency:
  group: retire-parkrun
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    # 90, not 40. The unhide walk reads HIDDEN rows, which are sparse (35,767
    # among ~450k in the window), so a page scans far to fill and 60 instants
    # timed out and were stepped past at ~29 s each: the dry run (run 6) took
    # 34 min where the hide took 12.5. An apply adds its writes on top.
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The script imports the adapter's blurbs, and the adapter sys.exit()s
      # without requests rather than raising.
      - name: Hide (or, with unhide, restore) the parkrun rows this pipeline imported
        env:
          APPLY_IN: ${{ inputs.apply }}
          UNHIDE_IN: ${{ inputs.unhide }}
        run: |
          pip install --quiet requests
          FLAGS=""
          if [ "$APPLY_IN" = "true" ]; then FLAGS="--apply"; fi
          if [ "$UNHIDE_IN" = "true" ]; then FLAGS="$FLAGS --unhide"; fi
          echo "flags: ${FLAGS:-(dry run)}"
          python mapsee_retire_parkrun.py $FLAGS
