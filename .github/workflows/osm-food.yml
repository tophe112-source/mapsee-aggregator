# Takeaway places from OpenStreetMap that can actually take an order.
#
# ONE JOB PER AREA, fanned out from the config. Before this, all areas ran
# serially in a single job with a 60-place cap each: measured 2026-08-13 at a
# 20-mile radius, the eight hubs hold 16,550 candidates with readable hours and
# a website, and 480 examined per week is THIRTY-FOUR WEEKS for a single pass.
# The pool had grown 6.6x and the throttle had not moved. Per-area jobs each get
# their own timeout and their own thousands, so a full sweep is an afternoon.
#
# The matrix is READ FROM osm_food_sources.json, so adding a hub adds a job. It
# is the whole reason adding hubs is cheap.
#
# WEEKLY, and on purpose. A restaurant's existence does not change overnight,
# Overpass is a free volunteer-run service that 429s if you lean on it, and every
# candidate costs a page fetch of somebody else's website. The expensive half of
# this job is being a guest on other people's infrastructure.
#
# Never add pull_request: reads SUPABASE_SERVICE_ROLE_KEY via the sync step.
name: OSM takeaway places

on:
  schedule:
    - cron: "10 5 * * 2"          # Tuesdays, before the 06:17 ingest
  workflow_dispatch:
    inputs:
      only:
        description: "One area by name (blank = all)"
        required: false
        default: ""
      max_places:
        description: "Places examined per area (each costs a page fetch)"
        required: false
        default: "2000"
      radius_miles:
        description: "Override every hub's radius for this run (blank = config, 50)"
        required: false
        default: ""
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        required: false
        default: false
      full_refresh:
        description: "BACKFILL: re-examine from the first candidate and REWRITE existing rows"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # the cursor job commits osm_food_cursor.json

jobs:
  # ---------------------------------------------------------------------------
  # Which areas to run. Read from the config so the fan-out follows it.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.pick.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("osm_food_sources.json", encoding="utf-8"))
          only = (os.environ.get("ONLY") or "").strip().lower()
          names = [a["name"] for a in cfg["areas"]
                   if not only or only in a["name"].lower()]
          print("areas=" + json.dumps(names))
          PY
      - run: echo "Running ${{ steps.pick.outputs.areas }}"

  # ---------------------------------------------------------------------------
  # One area per job.
  # ---------------------------------------------------------------------------
  pull:
    needs: plan
    runs-on: ubuntu-latest
    # New York alone holds 4,735 readable candidates at 20 miles and each costs
    # ~2.5s (the venue site, then the destination check on whatever it names).
    # 330 minutes is that with room; a job that runs out simply stops at the
    # cursor and the next run continues, which is the point of the cursor.
    timeout-minutes: 330
    strategy:
      fail-fast: false            # one metro's bad day is not the sweep's
      max-parallel: 4             # be a guest: 4 concurrent, not 8
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # REQUIRED by the sync: it is the profile imported events are created_by.
      # Missing it is what failed run #1 — mapsee_supabase_sync.py falls back to
      # the literal string "<MAPSEE_HOST_PROFILE_ID>", which is not a UUID, so
      # every insert is rejected after the pull has already done all its work.
      MAPSEE_HOST_PROFILE_ID: ${{ secrets.MAPSEE_HOST_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # The place list for THIS area. A restaurant's existence does not change
      # weekly; at 20 miles the eight hubs hold 141,072 places, and re-pulling
      # those from a volunteer-run service every week would be rude as well as
      # slow. Keyed per area so the jobs do not fight over one cache entry.
      - name: Cache OSM place list
        uses: actions/cache@v4
        with:
          path: osm_places_cache
          key: osm-places-${{ matrix.area }}-${{ github.run_id }}
          restore-keys: |
            osm-places-${{ matrix.area }}-

      # Hours we may act on, and links we may call "Order pickup". This job puts
      # a business on the map with a button promising you can buy food from it;
      # both halves of that promise have already shipped wrong once.
      - name: Opening-hours and order-link guards
        run: |
          python test_osm_food.py
          python test_menu_links.py

      - name: Pull ${{ matrix.area }}
        run: |
          python mapsee_ingest_osm_food.py \
            --config osm_food_sources.json --store feeds_events.json \
            --only "${{ matrix.area }}" \
            --max-places ${{ github.event.inputs.max_places || 2000 }} \
            ${{ github.event.inputs.radius_miles && format('--radius-miles {0}', github.event.inputs.radius_miles) || '' }} \
            ${{ github.event.inputs.full_refresh == 'true' && '--ignore-cursor' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Sync to Supabase
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # --only-new is right for the WEEKLY run: it skips rows already in the
          # table, so a scheduled pull can only add and never churns 20k rows.
          # It is exactly wrong for a backfill, because the rows that need
          # rewriting are precisely the ones already there.
          ONLY_NEW="--only-new"
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            ONLY_NEW=""
            echo "FULL REFRESH: syncing without --only-new; existing rows will be rewritten"
          fi
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json $ONLY_NEW
          else
            echo "no feeds_events.json — nothing was pulled this run"
          fi

      # Each job hands its cursor up as an artifact rather than committing it.
      # Eight jobs pushing the same file to main is eight racing commits, and the
      # loser silently loses its place in the rotation — which reads as an area
      # that mysteriously stopped making progress.
      - name: Hand up the cursor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cursor-${{ strategy.job-index }}
          path: osm_food_cursor.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge every area's cursor and commit ONCE.
  # ---------------------------------------------------------------------------
  cursor:
    needs: pull
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cursor-*
          path: cursors
        continue-on-error: true
      - name: Merge and commit
        run: |
          python - <<'PY'
          import glob, json, os
          merged = {}
          if os.path.exists("osm_food_cursor.json"):
              merged = json.load(open("osm_food_cursor.json", encoding="utf-8"))
          # Each area's job only ever touched its OWN key, so a plain update per
          # file is the merge — no area can clobber another's position.
          for p in sorted(glob.glob("cursors/**/osm_food_cursor.json", recursive=True)):
              try:
                  merged.update(json.load(open(p, encoding="utf-8")))
              except Exception as exc:
                  print(f"skipping {p}: {exc}")
          json.dump(merged, open("osm_food_cursor.json", "w", encoding="utf-8"),
                    indent=1, sort_keys=True)
          print(json.dumps(merged, indent=1, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm_food_cursor.json
          git diff --staged --quiet || git commit -m "osm-food: advance the cursor [skip ci]"
          git push
