# Takeaway places from OpenStreetMap that can actually take an order.
#
# WEEKLY, not daily, and on purpose. A restaurant's existence does not change
# overnight, Overpass is a free volunteer-run service that 429s if you lean on
# it, and every candidate costs a page fetch of somebody else's website. The
# expensive half of this job is being a guest on other people's infrastructure.
#
# It writes into the shared store; mapsee_supabase_sync.py (run by
# aggregate-events.yml) is what puts it on the map.
#
# Never add pull_request: reads SUPABASE_SERVICE_ROLE_KEY via the sync step.
name: OSM takeaway places

on:
  schedule:
    - cron: "10 5 * * 2"          # Tuesdays, before the 06:17 ingest
  workflow_dispatch:
    inputs:
      only:
        description: "One area by name (blank = all)"
        required: false
        default: ""
      max_places:
        description: "Places examined per area (each costs a page fetch)"
        required: false
        default: "60"
      radius_miles:
        description: "Override every hub's radius for this run (blank = config, 50)"
        required: false
        default: ""
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        required: false
        default: false
      full_refresh:
        description: "BACKFILL: re-examine from the first candidate and REWRITE existing rows"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # commits osm_food_cursor.json; see the step at the end

jobs:
  osm-food:
    runs-on: ubuntu-latest
    # 45 is plenty for the weekly 60-per-area rotation. A full_refresh re-examines
    # every candidate and now costs TWO fetches each (the venue site, then the
    # order/booking destination it names), so all eight areas at ~3,100 readable
    # candidates would run well past it — run a backfill ONE AREA AT A TIME.
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # REQUIRED by the sync: it is the profile imported events are created_by.
      # Missing it is what failed run #1 — mapsee_supabase_sync.py falls back to
      # the literal string "<MAPSEE_HOST_PROFILE_ID>", which is not a UUID, so
      # every insert is rejected after the pull has already done all its work.
      MAPSEE_HOST_PROFILE_ID: ${{ secrets.MAPSEE_HOST_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # The place lists, so a weekly run does not re-ask Overpass for every
      # restaurant in eight metros to examine sixty of them. A restaurant's
      # EXISTENCE does not change weekly; at a 50-mile radius Seattle alone
      # holds 9,765 places, and pulling that from a volunteer-run service every
      # week to look at 60 would be rude as well as slow.
      #
      # restore-keys means a run always starts from the newest cache it can
      # find; the ingest then re-fetches only the areas whose file is older than
      # --cache-days (30). The key changes weekly so the cache is re-saved with
      # whatever was refreshed.
      - name: Cache OSM place lists
        uses: actions/cache@v4
        with:
          path: osm_places_cache
          key: osm-places-${{ github.run_id }}
          restore-keys: |
            osm-places-

      # Hours we may act on, and links we may call "Order pickup". This job puts
      # a business on the map with a button promising you can buy food from it;
      # both halves of that promise have already shipped wrong once.
      - name: Opening-hours and order-link guards
        run: |
          python test_osm_food.py
          python test_menu_links.py

      - name: Pull takeaway places
        run: |
          python mapsee_ingest_osm_food.py \
            --config osm_food_sources.json --store feeds_events.json \
            --max-places ${{ github.event.inputs.max_places || 60 }} \
            ${{ github.event.inputs.radius_miles && format('--radius-miles {0}', github.event.inputs.radius_miles) || '' }} \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.full_refresh == 'true' && '--ignore-cursor' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Sync to Supabase
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Guarded like every other sync step here: a pull that found nothing
          # writes no store, and "file not found" is a confusing way to report
          # a quiet week.
          # --only-new is right for the WEEKLY run: it skips rows already in the
          # table, so a scheduled pull can only add and never churns 20k rows.
          # It is exactly wrong for a backfill, because the rows that need
          # rewriting are precisely the ones already there. full_refresh drops
          # it so the new description — the Website line that lets an owner
          # claim the place, the Reserve link, a re-verified order link —
          # actually lands on the restaurants already on the map.
          ONLY_NEW="--only-new"
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            ONLY_NEW=""
            echo "FULL REFRESH: syncing without --only-new; existing rows will be rewritten"
          fi
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json $ONLY_NEW
          else
            echo "no feeds_events.json — nothing was pulled this run"
          fi

      # The cursor is the only state this job keeps, and it is what makes the
      # NEXT run look at different places. Unpersisted, every run re-examines
      # the same first --max-places candidates and coverage is capped forever —
      # silently, because the store dedupes so it just looks like a quiet week.
      # Same reason curation_cursor.json is committed.
      - name: Commit the cursor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm_food_cursor.json
          git diff --staged --quiet || git commit -m "osm-food: advance the cursor [skip ci]"
          git push
