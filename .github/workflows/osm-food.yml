# Takeaway places from OpenStreetMap that can actually take an order.
#
# ONE JOB PER AREA, fanned out from the config. Before this, all areas ran
# serially in a single job with a 60-place cap each: measured 2026-08-13 at a
# 20-mile radius, the eight hubs hold 16,550 candidates with readable hours and
# a website, and 480 examined per week is THIRTY-FOUR WEEKS for a single pass.
# The pool had grown 6.6x and the throttle had not moved. Per-area jobs each get
# their own timeout and their own thousands, so a full sweep is an afternoon.
#
# The matrix is READ FROM osm_food_sources.json, so adding a hub adds a job. It
# is the whole reason adding hubs is cheap.
#
# WEEKLY, and on purpose. A restaurant's existence does not change overnight,
# Overpass is a free volunteer-run service that 429s if you lean on it, and every
# candidate costs a page fetch of somebody else's website. The expensive half of
# this job is being a guest on other people's infrastructure.
#
# Never add pull_request: reads SUPABASE_SERVICE_ROLE_KEY via the sync step.
name: OSM takeaway places

on:
  schedule:
    - cron: "10 5 * * 2"          # Tuesdays, before the 06:17 ingest
  workflow_dispatch:
    inputs:
      only:
        description: "One area by name (blank = all)"
        required: false
        default: ""
      max_places:
        description: "Places examined per area (each costs a page fetch)"
        required: false
        default: "2000"
      radius_miles:
        description: "Override every hub's radius for this run (blank = config, 50)"
        required: false
        default: ""
      dry_run:
        description: "Report only, write nothing"
        type: boolean
        required: false
        default: false
      full_refresh:
        description: "BACKFILL: re-examine from the first candidate (scheduled windows already refresh changed rows)"
        type: boolean
        required: false
        default: false

# ONE RUN AT A TIME. Two runs of this workflow write the same Supabase rows and
# both try to commit osm_food_cursor.json — and the `cursor` job carries
# `if: always()`, so it commits even when the `pull` jobs it needs were
# cancelled.
#
# Not hypothetical. On 2026-08-17 a full_refresh dispatch was retried through a
# GitHub 503 and started TWO runs 26 seconds apart (32052219380, 32052252115).
# The duplicate was cancelled by hand while it was still warming the place
# cache, which is the only reason it cost nothing: nothing here would have
# stopped it ingesting and syncing over the top of its twin.
#
# cancel-in-progress is FALSE deliberately. A full refresh is a three-hour write
# across ~7,000 rows, and killing one midway leaves the table half rewritten
# with no record of where it stopped. A second run waits instead — same choice,
# for the same reason, as aggregate-events.yml.
concurrency:
  group: osm-food
  cancel-in-progress: false

permissions:
  contents: write   # the cursor job commits osm_food_cursor.json

jobs:
  # ---------------------------------------------------------------------------
  # Which areas to run. Read from the config so the fan-out follows it.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      areas: ${{ steps.pick.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("osm_food_sources.json", encoding="utf-8"))
          only = (os.environ.get("ONLY") or "").strip().lower()
          names = [a["name"] for a in cfg["areas"]
                   if not only or only in a["name"].lower()]
          print("areas=" + json.dumps(names))
          PY
      - run: echo "Running ${{ steps.pick.outputs.areas }}"

      # Area runners own their rolling caches. The former serial warm pass
      # timed out after 45m in Portland (29/30 tiles) on 2026-09-08, then every
      # runner cold-fetched anyway. Second-hand and amenities already use this
      # pattern. Keep max-parallel=4 to bound pressure on Overpass.

  # ---------------------------------------------------------------------------
  # One area per job.
  # ---------------------------------------------------------------------------
  pull:
    needs: plan
    runs-on: ubuntu-latest
    # New York alone holds 4,735 readable candidates at 20 miles and each costs
    # ~2.5s (the venue site, then the destination check on whatever it names).
    # 330 minutes is that with room; a job that runs out simply stops at the
    # cursor and the next run continues, which is the point of the cursor.
    # 330 is the CEILING, not the plan. --max-minutes 290 on the ingest below
    # is what actually ends the sweep, forty minutes early, because a step
    # CANCELLED by this number skips every step after it: on 2026-08-25 Paris
    # ran 07:33 -> 13:03 and lost its sync, its cursor slice and its hand-up,
    # so a five-and-a-half-hour sweep was discarded AND the cursor never moved
    # — next week it would start in the same place and do it again. Seven other
    # metros finished in 1-3 hours, so the cost is not predictable from the
    # candidate count and the budget has to be wall-clock.
    timeout-minutes: 330
    strategy:
      fail-fast: false            # one metro's bad day is not the sweep's
      max-parallel: 4             # be a guest: 4 concurrent, not 8
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # REQUIRED by the sync: it is the profile imported events are created_by.
      # Missing it is what failed run #1 — mapsee_supabase_sync.py falls back to
      # the literal string "<MAPSEE_HOST_PROFILE_ID>", which is not a UUID, so
      # every insert is rejected after the pull has already done all its work.
      MAPSEE_HOST_PROFILE_ID: ${{ secrets.MAPSEE_HOST_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore this area's place cache
        uses: actions/cache/restore@v4
        with:
          path: osm_places_cache
          key: osm-food-area-v1-${{ matrix.area }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            osm-food-area-v1-${{ matrix.area }}-
            osm-places-all-

      - name: Opening-hours and order-link guards
        run: |
          python test_osm_food.py
          python test_menu_links.py

      - name: Pull ${{ matrix.area }}
        run: |
          python mapsee_ingest_osm_food.py \
            --config osm_food_sources.json --store feeds_events.json \
            --only "${{ matrix.area }}" \
            --max-places ${{ github.event.inputs.max_places || 2000 }} \
            --max-minutes 290 \
            ${{ github.event.inputs.radius_miles && format('--radius-miles {0}', github.event.inputs.radius_miles) || '' }} \
            ${{ github.event.inputs.full_refresh == 'true' && '--ignore-cursor' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Sync to Supabase
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Refresh changed rows in every cursor window. OSM hours, contact
          # details and transactional links can change after first import;
          # --only-new froze those values forever. --skip-unchanged keeps the
          # normal case read-only, and the sync's claimed-row guard preserves
          # venue-owner edits. full_refresh still controls cursor restart above.
          if [ -f feeds_events.json ]; then
            python mapsee_supabase_sync.py --store feeds_events.json --skip-unchanged
          else
            echo "no feeds_events.json — nothing was pulled this run"
          fi

      # Each job hands its cursor up as an artifact rather than committing it.
      # Eight jobs pushing the same file to main is eight racing commits, and the
      # loser silently loses its place in the rotation — which reads as an area
      # that mysteriously stopped making progress.
      #
      # HAND UP ONLY THIS AREA'S KEY. The whole file would carry STALE copies of
      # every other area's position too — each job starts from the committed
      # cursor and edits one key — so merging whole files means the last one
      # read wins for every key and seven areas' progress is thrown away.
      # Measured on the first matrix run: Seattle 207, Portland 205, Chicago 205,
      # New York 205, Paris 205, Tokyo 205 all present in the artifacts, and a
      # whole-file merge produced 180 for every one of them, keeping only
      # Melbourne — whichever happened to sort last.
      - name: Take this area's cursor slice
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          AREA: ${{ matrix.area }}
        run: |
          python - <<'PY'
          import json, os
          area = os.environ["AREA"]
          try:
              cur = json.load(open("osm_food_cursor.json", encoding="utf-8"))
          except Exception:
              cur = {}
          slice_ = {area: cur[area]} if area in cur else {}
          json.dump(slice_, open("cursor_slice.json", "w", encoding="utf-8"), sort_keys=True)
          print("handing up", slice_)
          PY

      - name: Save completed area cache even if a later step failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: osm_places_cache
          key: osm-food-area-v1-${{ matrix.area }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Hand up the cursor
        id: cursor_upload
        continue-on-error: true
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cursor-${{ strategy.job-index }}
          path: cursor_slice.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Retry cursor handoff after an upload failure
        if: ${{ always() && steps.cursor_upload.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cursor-${{ strategy.job-index }}-retry
          path: cursor_slice.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge every area's cursor and commit ONCE.
  # ---------------------------------------------------------------------------
  cursor:
    needs: pull
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cursor-*
          path: cursors
        continue-on-error: true
      # RE-MERGE ONTO THE LATEST main EACH ATTEMPT, and retry.
      #
      # The first version committed against the checkout from run start and
      # pushed once. A sweep takes hours, so any push to main in that window —
      # a human, another workflow, the aggregate job — rejects it:
      #
      #     ! [rejected]  main -> main (fetch first)
      #
      # That is what happened on the first matrix run. The merge itself was
      # perfect (Melbourne correctly 180 -> 205); the push lost it. And it fails
      # at the very LAST step, after every area has done all of its work, so the
      # whole sweep's position is thrown away with nothing to show for it.
      #
      # Rebasing would work, but re-reading is better: the cursor is a set of
      # per-area positions, so recomputing the merge against whatever main says
      # NOW is always correct and can never conflict. Each attempt starts from
      # the newest base.
      - name: Merge and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main        # cursors/ is untracked, so it survives
            python - <<'PY'
          import glob, json, os
          merged = {}
          if os.path.exists("osm_food_cursor.json"):
              merged = json.load(open("osm_food_cursor.json", encoding="utf-8"))
          # Each artifact is a SLICE — one area's key and nothing else — so an
          # update per file genuinely cannot clobber another area's position,
          # nor whatever else landed on main meanwhile. It used to be the whole
          # file, which meant the last one read overwrote six areas' progress
          # with its own stale copies. A slice larger than one key is a bug in
          # the step that wrote it, so say so rather than trusting it.
          for p in sorted(glob.glob("cursors/**/cursor_slice.json", recursive=True)):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception as exc:
                  print(f"skipping {p}: {exc}")
                  continue
              if len(d) > 1:
                  print(f"::warning::{p} carries {len(d)} areas, expected 1: {sorted(d)}")
              merged.update(d)
          json.dump(merged, open("osm_food_cursor.json", "w", encoding="utf-8"),
                    indent=1, sort_keys=True)
          print(json.dumps(merged, indent=1, sort_keys=True))
          PY
            git add osm_food_cursor.json
            if git diff --staged --quiet; then
              echo "cursor unchanged — nothing to commit"
              exit 0
            fi
            git commit -m "osm-food: advance the cursor [skip ci]"
            if git push; then
              echo "cursor pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); re-merging onto the new head"
            sleep $((attempt * 5))
          done
          echo "::error::could not push the cursor after 5 attempts"
          exit 1
