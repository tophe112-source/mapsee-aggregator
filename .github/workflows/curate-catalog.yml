name: Grow the catalog

# The catalog only grows when somebody runs catalog_curate.py by hand. Every
# piece of the loop already exists — discover finds candidate datasets, verify
# proves each one returns real FUTURE events under the production User-Agent,
# merge writes the survivors into the config files — and nothing has ever
# scheduled it. source-health.yml runs `audit`, which only re-checks feeds that
# are already wired in; it can tell you the catalog is shrinking and can do
# nothing about it growing.
#
# WHY THIS SWEEPS THREE CATALOGS AND KEEPS A CURSOR. Scheduling the loop was not
# enough: it converged. Discovery read the FIRST PAGE of each catalog query and
# stopped, so it saw the same rows every week — "events" alone matches 1,390
# Socrata datasets and only the top 100 were ever probed. Measured on the real
# catalog, a full 17-query sweep proposed six candidates, and every one of the
# six was a URL the ledger had already rejected (the ledger filter here read a
# field the ledger has never had). A weekly job that re-reads page one for ever
# is not curation, it is a cron entry.
#
# So: an offset cursor per query, committed, so each run walks new ground and
# wraps when it has been all the way round; the ledger filter fixed, so the
# candidate budget buys new URLs rather than re-buying dead ones; ckan on the
# SCHEDULE rather than only on a human's dispatch; and mobilizon, which is the
# only backend whose supply grows on its own — federated instances that did not
# exist last quarter appear in a public directory, 95 of them today against the
# three that were configured by hand.
#
# WHAT THIS IS FOR. Each mapsee front door opens onto a set of categories
# (`categories` in mapsee/src/lens.js). A door whose categories have no supply is
# an empty map with a brand on it — which is not hypothetical: `volunteer` has
# five curated sources on the planet and awaresie.com opens onto it, and
# `fitness` was not even a discovery target until this workflow was written, so
# wegosie.com could not have grown if anyone had run the loop manually.
#
# catalog_curate.curated_categories() reads the live roster from
# https://mapsee.me/api/lenses, so a door committed in the product repo starts
# being curated for here with no change on this side.
#
# WHY IT COMMITS RATHER THAN OPENING A PR. Everything merged has been proven to
# return future events minutes earlier; a PR would sit unreviewed and the whole
# point is that the catalog improves without anyone remembering to look. The
# audit in source-health.yml is the safety net: a source that decays is flagged,
# and now FEED_DOWN names it.
#
# Triggers are schedule + workflow_dispatch ONLY. This job holds no secrets, but
# it commits to main, so it must never be reachable from fork code.

#
# WHY IT RUNS DAILY RATHER THAN WEEKLY. The cursor is what makes repetition
# worth anything: each run reads the NEXT page of each catalog query, so seven
# runs cover seven times the ground one run does, at ~4 minutes each. Weekly, the
# 1,390 Socrata datasets matching "events" alone would take most of a year to
# walk once. The schedule was the binding constraint on how fast the catalog can
# grow, and it cost nothing to lift.
#
# WHY THERE IS A SECOND, CATEGORY-PINNED SWEEP. Budget spent thinnest-first is
# still budget spent in one pool, and the pool is lopsided: `market` has 509
# curated sources and `fitness` and `running` have ZERO — not thin, zero, in
# every country, which means wegosie.com opens onto an empty map. Wednesday's run
# passes `--category` with whatever `coverage --json` reports at zero and spends
# the entire budget there.
#
# What that sweep will and will not fix, measured rather than assumed: a pinned
# socrata run over all five fitness/running queries reads 315 datasets and
# proposes NONE — 174 carry no usable event shape, 140 are not event listings.
# Municipal open data does not publish road races and gym timetables in a
# geocoded, event-shaped form, so no amount of discovery budget will grow those
# two categories from Socrata. The pinned sweep still earns its place on ckan
# (which is the only non-US path, and where `sport facilities` / `leisure
# centres` / `parkrun` do return rows), and it makes the zero visible every week
# instead of once someone reads a 500-line coverage dump. Closing fitness and
# running properly needs a different KIND of source — a run-club/parkrun/rec-
# centre adapter — not another query.

on:
  schedule:
    # Daily 03:20 UTC. Off the ingest schedule entirely — the daily sweep is
    # 06:17, the heavy sweep Mon & Thu 06:40, the audit Sundays 04:10 — so a slow
    # discovery run cannot eat into an ingest window, and anything merged is in
    # place before the next sweep picks it up.
    - cron: "20 3 * * *"
    # Wednesdays 03:50 UTC — the gap sweep. Whole budget on the categories that
    # have no supply at all.
    #
    # THIRTY MINUTES IS NOT A GAP, and this line used to claim it was ("30
    # minutes after the daily run, which by then has finished and committed").
    # The job takes 40-90 minutes, so the gap sweep has ALWAYS started while the
    # daily one was still going; and GitHub delivers a late schedule as a batch,
    # so on 2026-09-02 the two arrived at 07:59 and 08:08 — nine minutes apart,
    # which no cron spacing can prevent. What makes the overlap safe is the
    # `concurrency` group (one run at a time), `ref:` on checkout (the queued
    # run starts from what the first one committed) and the re-applying push
    # loop — not this number. Moving it buys nothing; the number is here so the
    # two runs land on the same day, which is all it was ever doing.
    - cron: "50 3 * * 3"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many candidates to probe PER BACKEND (each costs a live request)"
        default: "300"
      backend:
        description: "Which catalog to sweep. 'all' is what the schedule runs."
        type: choice
        options: [all, socrata, ckan, mobilizon, civic, osm]
        default: all
      category:
        description: "Pin the sweep to these lens categories (comma-separated). 'gaps' = whatever has zero sources. Blank = sweep everything."
        default: ""
      dry_run:
        description: "Verify only — do not merge or commit"
        type: boolean
        default: false

concurrency:
  group: curate-catalog
  cancel-in-progress: false

permissions:
  contents: write      # to commit newly verified sources + the refreshed ledger

jobs:
  curate:
    runs-on: ubuntu-latest
    env:
      # The branch this run curates. One name for checkout, for the fetch and
      # for the reset, so a workflow_dispatch from a branch cannot check out one
      # ref and reset onto another — which would silently replace that branch's
      # tree with main's and then commit the result.
      BRANCH: ${{ github.ref_name }}
      # Untracked, so it survives `git reset --hard`. It is the only channel
      # between the sweep and the commit step once that step re-reads main.
      SNAPSHOT: .curate-snapshot
    # Verification is one live HTTP request per candidate against servers that
    # are sometimes slow and sometimes dead; the ceiling is the point, and a run
    # that hits it still commits everything it proved before stopping.
    timeout-minutes: 90
    steps:
      # `ref:` MATTERS HERE, and its absence is what killed 2026-09-02's second
      # run. actions/checkout defaults to github.sha — the tip as it was when
      # the run was CREATED — and this workflow's two crons put a second run in
      # the concurrency queue behind the first. `concurrency` serialises the
      # two, correctly, but it cannot un-stale a SHA: the Wednesday run was
      # created at 08:08 against ab5ee01, waited, started at 08:40:12, and
      # checked out ab5ee01 seven seconds after the daily run had superseded it
      # with 7f421c0. Thirty-one minutes of discovery later its push was
      # rejected and all of it was thrown away.
      #
      # Naming the BRANCH resolves the ref when checkout runs, so a queued run
      # starts from the newest base. That is not only about the push: the
      # cursor is the whole reason this job is continual rather than
      # convergent, so a run computing from a superseded cursor re-walks ground
      # the run ahead of it just covered.
      #
      # github.ref_name rather than a literal 'main': on a schedule it IS the
      # default branch, and a workflow_dispatch from a branch then checks out
      # and pushes that branch instead of silently curating main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Where is the catalog thin RIGHT NOW, measured against the doors that
      # actually exist? Printed into the job summary so the run is readable
      # without downloading anything.
      - name: Coverage before
        run: |
          python catalog_curate.py coverage | tee coverage-before.txt
          python catalog_curate.py coverage --json > coverage-before.json
          {
            echo '## Coverage before'
            echo '```'
            cat coverage-before.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Which categories is this run pinned to? The Wednesday cron asks for
      # whatever is at ZERO; a dispatch can name them, or say 'gaps' for the
      # same thing. Empty means sweep everything, which is the daily default.
      - name: Resolve the category target
        id: target
        env:
          WANT: ${{ inputs.category || (github.event.schedule == '50 3 * * 3' && 'gaps' || '') }}
        run: |
          set -euo pipefail
          if [ "$WANT" = "gaps" ]; then
            CATS=$(python -c "import json;print(','.join(json.load(open('coverage-before.json'))['zero_categories']))")
            if [ -z "$CATS" ]; then
              echo "No category is at zero — sweeping everything instead."
            else
              echo "Categories with NO curated supply: $CATS"
            fi
          else
            CATS="$WANT"
          fi
          echo "cats=$CATS" >> "$GITHUB_OUTPUT"

      # discover → verify → merge, ONCE PER BACKEND. The schedule used to sweep
      # socrata alone, because `inputs` is empty on a `schedule` event and the
      # fallback was 'socrata' — so ckan (every non-US portal) only ran when a
      # human remembered to dispatch it, which is to say twice ever: the ledger
      # holds 2 ckan probes against 431 of everything else.
      #
      # Each backend is a separate discover→verify→merge cycle rather than one
      # concatenated candidate list, so a catalog having a bad morning costs its
      # own cycle and nothing else. `set +e` for the same reason; verify handles
      # an empty candidate list correctly and merge is guarded on a non-empty file.
      #
      # The backend is a POSITIONAL argument and must come before the flags:
      # main() reads it as argv[2:3] and locates --limit/--out by index. A
      # `--backend ckan` parses as socrata and silently sweeps the wrong catalog,
      # so it is passed as $b in first position and never interpolated into flags.
      #
      # --category is passed as a separate argv pair built into $CATFLAG rather
      # than interpolated into the command, so an empty target contributes no
      # argument at all instead of an empty string that argv.index() would then
      # read as a category named "".
      - name: Discover, verify and merge
        env:
          CATS: ${{ steps.target.outputs.cats }}
        run: |
          set +e
          case "${{ inputs.backend || 'all' }}" in
            # THE TWO CRAWLERS GO LAST, cheapest catalog reads first. osm and
            # civic are the only backends whose cost is a crawl rather than a
            # catalog read, so if the run is going to be cut short it should be
            # cut short in one of them — and both carry a cursor, so the ground
            # they did not reach is simply where the next run starts.
            #
            # civic BEFORE osm, and the order is the budget. Measured: civic is
            # about 7 seconds and a dozen requests per city, and 40 cities is a
            # bounded ~5 minutes, where osm's cost per metro is unbounded (a
            # dense metro is hundreds of venue fetches) and it holds the
            # --max-minutes deadline for exactly that reason. Putting the
            # bounded crawl first means a bad Overpass day cannot starve it.
            all) BACKENDS="socrata ckan mobilizon civic osm" ;;
            *)   BACKENDS="${{ inputs.backend }}" ;;
          esac
          LIMIT="${{ inputs.limit || '300' }}"
          CATFLAG=""
          if [ -n "$CATS" ]; then
            CATFLAG="--category $CATS"
            echo "Pinned to: $CATS"
          fi
          # STOP BEFORE THE JOB CAP, NOT ON IT.
          #
          # timeout-minutes: 90 CANCELS the step, and a cancelled step SKIPS
          # every step after it — including "Commit new sources". So a run that
          # hit the ceiling threw away every source it had verified, under a
          # comment on that ceiling claiming the opposite ("a run that hits it
          # still commits everything it proved before stopping"). Both of
          # 2026-08-26's scheduled runs did exactly that, 04:06:37 -> 05:36:41
          # and 05:36:58 -> 07:07:00: ninety minutes to the second, twice.
          #
          # AND THE BUDGET BELONGS TO `osm`, not to the loop. Measured from that
          # run's own log: socrata 6 seconds, ckan 2 minutes, mobilizon 3
          # seconds, osm the remaining 88. A deadline checked BETWEEN backends
          # would never once have fired, because the expensive one is last and
          # nothing follows it — so it is passed INTO the sweep, which already
          # counts the metros it read and advances its cursor by that, and
          # already treats an unreached metro as where the next run starts.
          # 55, not 70, and the number comes from a measured run rather than
          # from the cap minus a guess. 2026-08-26 20:53: socrata 6s, ckan 101s,
          # mobilizon 3s, "Coverage after" + "Commit new sources" 2s together —
          # so essentially the whole 90 belongs to osm, and it has to cover
          # DISCOVER *and* VERIFY, which probes every candidate discover found
          # with one more live request. 70 left too little for the second half
          # and the step was cancelled again (harmlessly this time: always()
          # meant it still committed its cursors and ledger).
          OSM_BUDGET_MIN=55
          for b in $BACKENDS; do
            echo "::group::$b"
            # socrata is the default and takes no positional; the others do.
            # tee'd because DISCOVER's own output is where the skip breakdown
            # lives, and it was the one stage nobody could read afterwards.
            # `osm` reports why each successful probe still produced nothing
            # ("ics-without-feed", "no-config-shape(mylisting)") and which metros
            # went UNREAD because Overpass never answered — both invisible in a
            # log nobody scrolls, and both the numbers that say where to work next.
            BUDGET=""
            [ "$b" = "osm" ] && BUDGET="--max-minutes $OSM_BUDGET_MIN"
            # civic gets a deadline too, and a smaller one. It is bounded by its
            # city count where osm is not, so this is a backstop against a slow
            # host rather than the knob that sizes the run — CIVIC_CITIES_PER_RUN
            # is that. Ten leaves osm the budget it was measured to need.
            [ "$b" = "civic" ] && BUDGET="--max-minutes 10"
            if [ "$b" = "socrata" ]; then
              python catalog_curate.py discover --limit "$LIMIT" $CATFLAG --out "cand-$b.json" | tee "discover-$b.txt"
            else
              python catalog_curate.py discover "$b" --limit "$LIMIT" $CATFLAG $BUDGET --out "cand-$b.json" | tee "discover-$b.txt"
            fi
            [ -f "cand-$b.json" ] || echo '[]' > "cand-$b.json"
            python catalog_curate.py verify "cand-$b.json" | tee "verify-$b.txt"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ -s "cand-$b.verified.json" ]; then
              python catalog_curate.py merge "cand-$b.verified.json" | tee "merge-$b.txt"
            else
              echo "no merge for $b" | tee "merge-$b.txt"
            fi
            {
              echo "## $b"
              echo '```'
              # The FLAG lines are the ones worth reading at a glance: a category
              # with no discovery query is a door that cannot grow supply.
              grep -h '^  FLAG' "verify-$b.txt" "merge-$b.txt" 2>/dev/null
              grep -hE '^(skipped:|  advanced |  .*UNREAD|  .*SKIPPING)' "discover-$b.txt" 2>/dev/null
              tail -25 "verify-$b.txt"
              cat "merge-$b.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # The trend, not just today's number. One JSON line per run, appended and
      # committed: "is the catalog improving" was previously answerable only by
      # diffing two 500-line terminal dumps from different weeks, which meant
      # nobody answered it, which is how `fitness` and `running` sat at zero
      # sources through eleven scheduled runs without anyone noticing.
      # `always()` rather than success(): a step CANCELLED by the job's own
      # timeout-minutes skips everything after it, which is how ninety minutes
      # of verified sources went in the bin. The internal deadline above should
      # mean this never fires on a cancel — this is the belt to its braces, and
      # the thing that makes the timeout comment above the job true.
      - name: Coverage after
        if: ${{ always() && !inputs.dry_run }}
        run: |
          set -euo pipefail
          python catalog_curate.py coverage | tee coverage-after.txt
          python catalog_curate.py coverage --json > coverage-after.json
          # THE APPEND MOVED INTO THE COMMIT STEP. It used to happen here, and
          # the commit step now resets to origin/main and re-applies, which
          # would have discarded this line on the first attempt and appended a
          # second copy on a retry. The snapshot directory is untracked, so it
          # survives `git reset --hard` — same trick osm-food.yml's `cursors/`
          # uses — and is the only channel between the two steps.
          mkdir -p "$SNAPSHOT"
          cp coverage-after.json "$SNAPSHOT/coverage-after.json"
          cp curation_ledger.json "$SNAPSHOT/curation_ledger.json"
          cp curation_cursor.json "$SNAPSHOT/curation_cursor.json"
          python catalog_curate.py coverage --delta coverage-before.json coverage-after.json \
            >> "$GITHUB_STEP_SUMMARY"
          {
            echo '## Coverage after'
            echo '```'
            cat coverage-after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The candidate/verify scratch files are run artifacts, not sources — only
      # the configs and the ledger are committed, and the `git add` names them,
      # so nothing scratch can reach a commit whatever is lying around the
      # runner. `git diff --staged --quiet` keeps a week with no new feeds from
      # producing an empty commit; it reads the INDEX rather than the worktree
      # because the loop below stages before it asks.
      # curation_cursor.json is committed with the configs and is NOT scratch: it
      # is the offset each catalog query reached, and it is the only reason the
      # next run looks at different rows than this one. Dropped from the commit,
      # every run would restart at offset 0 and the job would go back to
      # re-reading the same first page of "events" for ever.
      # coverage_history.jsonl is committed for the same reason as the cursor: it
      # is the only record that survives the runner, and a trend nobody can read
      # next month is not a trend.
      # A PUSH THAT LOSES IS NOT A RUN THAT FAILED — RE-APPLY AND TRY AGAIN.
      #
      # This step used to build one commit on the checkout and push it once, so
      # anything landing on main during the 30-90 minutes above made it a
      # non-fast-forward and the run died HERE, at its last step, with every
      # source it had verified thrown away. Three runs died that way — 2026-08-20,
      # 2026-08-27 (six commits landed inside its hour, one of them
      # osm-amenities' cursor) and 2026-09-02 (the Wednesday gap sweep, queued
      # behind the daily one, checked out the SHA the daily one had just
      # superseded — see the `ref:` note on checkout, which is the other half of
      # this fix).
      #
      # The loop is osm-food.yml's, and so is the reasoning: rebasing would
      # work, but RE-READING is better, because recomputing against whatever
      # main says NOW cannot conflict. Each attempt resets to the fresh tip and
      # re-applies, so attempt 1 and attempt 5 run identical code and the first
      # attempt is not a special case that only gets exercised on a good day.
      #
      # Re-reading is only correct because every part of what this run produced
      # is re-appliable, which is a property of these four files and not a
      # general one:
      #   *_sources.json         `merge` dedups by canonical URL against the
      #                          config as it stands, so re-running it adds our
      #                          entries and re-adds nothing.
      #   ledger/cursor/history  `reapply` unions them onto the fresh base;
      #                          catalog_curate.py carries the merge rules and
      #                          test_curate_reapply.py grades them.
      # The verified-candidate files are the INPUT to that, so they must outlive
      # the reset: they are untracked, which is what makes them survive
      # `git reset --hard` (the same trick osm-food's `cursors/` relies on).
      # The scratch `rm` that used to open this step is gone rather than moved —
      # it ran BEFORE the merge that now needs those files, and with the `git
      # add` naming its four paths there was never anything for it to protect.
      - name: Commit new sources
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python catalog_curate.py reapply "$SNAPSHOT"
            # An `if`, not `[ -s "$v" ] && ...`: the default shell is `bash -e`,
            # and a trailing && whose left side is false makes the loop body
            # return non-zero, which would end the step the moment a backend
            # verified nothing.
            for v in cand-*.verified.json; do
              if [ -s "$v" ]; then python catalog_curate.py merge "$v"; fi
            done
            git add -- '*_sources.json' curation_ledger.json curation_cursor.json coverage_history.jsonl
            if git diff --staged --quiet; then
              echo "No config, ledger or cursor change — nothing to commit."
              exit 0
            fi
            # Two -m flags, not one multi-line string: a bare continuation line
            # sits at column 0 and terminates the `run: |` block scalar, which
            # makes the whole workflow file unparseable.
            git commit \
              -m "Curate: new verified feeds from the weekly sweep" \
              -m "Every entry added here returned real future events under the production User-Agent at verification time. Targets come from the live lens roster (mapsee.me/api/lenses), so this tracks whichever doors are committed."
            # `HEAD:$BRANCH`, not a bare `git push`. `reset --hard` moves HEAD
            # and says nothing about which ref a bare push would pick, so the
            # branch name that drove the fetch and the reset drives the push
            # too — one name, three uses. Caught in a simulation where the
            # local branch was not the one being curated: the bare form
            # cheerfully created a NEW branch on the remote, reported success
            # and left the curated branch untouched, which is a lost run
            # wearing a green tick.
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected ($BRANCH moved); re-applying onto the new head"
            sleep $((attempt * 5))
          done
          echo "::error::could not push the curated sources after 5 attempts"
          exit 1
